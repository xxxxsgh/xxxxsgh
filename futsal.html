<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Futsal Neon</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-text-size-adjust: none;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    background: #000000;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

/* =====================================================================
   CONFIG
   ===================================================================== */
var W = 1000, H = 540;                       // mundo logico
var F = { x: 40, y: 40, w: 920, h: 460 };    // retangulo da quadra
var GOAL_H = 150, GOAL_D = 30;               // boca e profundidade do gol
var GOAL_TOP = (H - GOAL_H) / 2;
var GOAL_BOT = GOAL_TOP + GOAL_H;
var AREA_H = 240;                            // faixa vertical do goleiro
var P_R = 15, B_R = 8;                       // raios jogador / bola
var P_SPEED = 265;                           // velocidade base do jogador
var BALL_FRICTION = 0.38;                    // fracao da velocidade que sobra por segundo
var SHOOT_SPEED = 800;
var TACKLE_SPEED = 540, TACKLE_TIME = 0.17, TACKLE_CD = 1.5;
var MATCH_TIME = 180;                        // 3 minutos
var COL_A = "#00e5ff";                       // time do jogador (ciano)
var COL_B = "#ff2d95";                       // time da CPU (magenta)
var COL_BALL = "#ffe14d";

var DIFF_LIST = [
  { label: "FÁCIL",   speed: 0.84, react: 0.45, gk: 170, shootErr: 0.17, aggro: 0.35 },
  { label: "NORMAL",  speed: 1.00, react: 0.22, gk: 265, shootErr: 0.09, aggro: 0.65 },
  { label: "DIFÍCIL", speed: 1.12, react: 0.13, gk: 335, shootErr: 0.04, aggro: 0.88 }
];
var diffIndex = 1;
function cfg() { return DIFF_LIST[diffIndex]; }

/* utilidades */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
function rnd() { return Math.random(); }

/* =====================================================================
   ESTADOS / ENTIDADES
   ===================================================================== */
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var fieldCv = document.createElement("canvas");
var dpr = 1, cssW = 0, cssH = 0, scale = 1, ox = 0, oy = 0;

var state = "MENU";          // MENU | PLAY | GOAL | END
var paused = false;
var timeLeft = MATCH_TIME;
var score = [0, 0];
var goalT = 0, goalTeam = 0; // animacao de gol
var graceT = 0, graceTeam = 0;       // so o time beneficiado pode tocar na bola
var restartT = 0, restartLabel = ""; // bola parada (lateral / escanteio / tiro de meta)
var shakeT = 0;
var menuTime = 0;
var controlled = null;

var players = [];
var ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: B_R, owner: null, receiver: null, recvT: 0, lastTouch: null };
var trail = [];
var particles = [];

function makePlayer(team, role, x, y) {
  return {
    team: team, role: role, x: x, y: y, vx: 0, vy: 0, r: P_R,
    fx: team === 0 ? 1 : -1, fy: 0,
    tackleT: 0, tackleCd: 0, tkx: 0, tky: 0,
    kickGrace: 0, aiT: 0, tx: x, ty: y,
    hold: 0, catchCd: 0
  };
}

function buildTeams() {
  players = [
    makePlayer(0, "gk",  F.x + 20, H / 2),
    makePlayer(0, "out", 330, 190),
    makePlayer(0, "out", 330, 350),
    makePlayer(1, "gk",  F.x + F.w - 20, H / 2),
    makePlayer(1, "out", 670, 190),
    makePlayer(1, "out", 670, 350)
  ];
}

function resetPositions(kickTeam) {
  var i, p;
  var pos0 = [[F.x + 20, H / 2], [330, 190], [330, 350]];
  var pos1 = [[F.x + F.w - 20, H / 2], [670, 190], [670, 350]];
  var k0 = 0, k1 = 0;
  for (i = 0; i < players.length; i++) {
    p = players[i];
    var pp = p.team === 0 ? pos0[k0++] : pos1[k1++];
    p.x = pp[0]; p.y = pp[1]; p.vx = 0; p.vy = 0;
    p.fx = p.team === 0 ? 1 : -1; p.fy = 0;
    p.tackleT = 0; p.tackleCd = 0; p.kickGrace = 0; p.aiT = 0;
    p.tx = p.x; p.ty = p.y; p.hold = 0; p.catchCd = 0;
  }
  // quem da a saida fica junto da bola
  var taker = (kickTeam === 0) ? players[1] : players[4];
  taker.x = W / 2 + (kickTeam === 0 ? -34 : 34);
  taker.y = H / 2;
  ball.x = W / 2; ball.y = H / 2; ball.vx = 0; ball.vy = 0;
  ball.owner = null; ball.receiver = null; ball.recvT = 0; ball.lastTouch = null;
  trail.length = 0;
  restartT = 0;
  graceTeam = kickTeam; graceT = 1.0;
  controlled = players[1];
}

function startMatch() {
  buildTeams();
  score[0] = 0; score[1] = 0;
  timeLeft = MATCH_TIME;
  paused = false;
  particles.length = 0;
  resetPositions(0);
  state = "PLAY";
}

/* =====================================================================
   INPUT (teclado + touch)
   ===================================================================== */
var keys = {};
var joy = { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 };
var pad = { on: false, x: 0, y: 0, prev: [] };
var btnPass  = { x: 0, y: 0, r: 52, on: false, id: -1 };
var btnShoot = { x: 0, y: 0, r: 58, on: false, id: -1 };
var hudRect = { x: 0, y: 0, w: 0, h: 0 };
var touchSeen = false;

document.addEventListener("keydown", function (e) {
  if (e.repeat) { return; }
  var k = e.key.toLowerCase();
  keys[k] = true;
  if (k === "arrowup" || k === "arrowdown" || k === "arrowleft" || k === "arrowright" || k === " ") {
    e.preventDefault();
  }
  if (state === "MENU") {
    if (k === "arrowleft")  { diffIndex = (diffIndex + 2) % 3; }
    if (k === "arrowright") { diffIndex = (diffIndex + 1) % 3; }
    if (k === "enter" || k === " ") { startMatch(); }
    return;
  }
  if (state === "END") {
    if (k === "enter" || k === " ") { startMatch(); }
    if (k === "escape") { state = "MENU"; }
    return;
  }
  if (state === "PLAY") {
    if (k === "p" || k === "escape") { paused = !paused; return; }
    if (paused) { paused = false; return; }
    if (k === "x") { actionPass(); }
    if (k === "z") { actionShoot(); }
  }
});
document.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

function hitCircle(b, x, y) { return dist(b.x, b.y, x, y) <= b.r + 14; }
function inRect(r, x, y) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function menuLayout() {
  var cx = cssW / 2;
  var bw = Math.min(126, cssW / 3.4), bh = 52;
  return {
    diff: [
      { x: cx - bw * 1.5 - 14, y: cssH * 0.50, w: bw, h: bh },
      { x: cx - bw * 0.5,      y: cssH * 0.50, w: bw, h: bh },
      { x: cx + bw * 0.5 + 14, y: cssH * 0.50, w: bw, h: bh }
    ],
    play: { x: cx - 115, y: cssH * 0.50 + bh + 26, w: 230, h: 66 }
  };
}
function endLayout() {
  var cx = cssW / 2;
  return {
    rematch: { x: cx - 115, y: cssH * 0.58, w: 230, h: 64 },
    menu:    { x: cx - 115, y: cssH * 0.58 + 78, w: 230, h: 52 }
  };
}

function handlePress(x, y, id) {
  if (state === "MENU") {
    var ml = menuLayout(), i;
    for (i = 0; i < 3; i++) { if (inRect(ml.diff[i], x, y)) { diffIndex = i; return; } }
    if (inRect(ml.play, x, y)) { startMatch(); }
    return;
  }
  if (state === "END") {
    var el = endLayout();
    if (inRect(el.rematch, x, y)) { startMatch(); return; }
    if (inRect(el.menu, x, y)) { state = "MENU"; }
    return;
  }
  if (state !== "PLAY") { return; }
  if (paused) { paused = false; return; }
  if (inRect(hudRect, x, y)) { paused = true; return; }
  if (hitCircle(btnPass, x, y))  { btnPass.on = true;  btnPass.id = id;  actionPass();  return; }
  if (hitCircle(btnShoot, x, y)) { btnShoot.on = true; btnShoot.id = id; actionShoot(); return; }
  if (x < cssW * 0.55 && !joy.active) {
    joy.active = true; joy.id = id; joy.ox = x; joy.oy = y; joy.x = x; joy.y = y;
  }
}
function handleMove(x, y, id) {
  if (joy.active && joy.id === id) { joy.x = x; joy.y = y; }
}
function handleRelease(id) {
  if (joy.active && joy.id === id) { joy.active = false; }
  if (btnPass.id === id)  { btnPass.on = false;  btnPass.id = -1; }
  if (btnShoot.id === id) { btnShoot.on = false; btnShoot.id = -1; }
}

canvas.addEventListener("touchstart", function (e) {
  e.preventDefault(); touchSeen = true;
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    handlePress(t.clientX, t.clientY, t.identifier);
  }
}, { passive: false });
canvas.addEventListener("touchmove", function (e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    handleMove(t.clientX, t.clientY, t.identifier);
  }
}, { passive: false });
function touchEnd(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    handleRelease(e.changedTouches[i].identifier);
  }
}
canvas.addEventListener("touchend", touchEnd, { passive: false });
canvas.addEventListener("touchcancel", touchEnd, { passive: false });
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

canvas.addEventListener("mousedown", function (e) { handlePress(e.clientX, e.clientY, "mouse"); });
canvas.addEventListener("mousemove", function (e) { handleMove(e.clientX, e.clientY, "mouse"); });
canvas.addEventListener("mouseup", function () { handleRelease("mouse"); });

/* gamepad: analogico esquerdo / d-pad mover, A = passe, B/X = chute, Start = pausa */
function padJust(gp, i) {
  var now = !!(gp.buttons[i] && gp.buttons[i].pressed);
  return now && !pad.prev[i];
}
function pollGamepad() {
  var nav = typeof navigator !== "undefined" ? navigator : null;
  if (!nav || !nav.getGamepads) { return; }
  var pads;
  try { pads = nav.getGamepads() || []; } catch (e) { return; }
  var gp = null, i;
  for (i = 0; i < pads.length; i++) {
    if (pads[i] && pads[i].connected) { gp = pads[i]; break; }
  }
  pad.on = !!gp;
  if (!gp) { pad.x = 0; pad.y = 0; pad.prev = []; return; }

  // movimento: analogico esquerdo com zona morta + d-pad
  var x = gp.axes && gp.axes.length > 1 ? gp.axes[0] : 0;
  var y = gp.axes && gp.axes.length > 1 ? gp.axes[1] : 0;
  if (Math.sqrt(x * x + y * y) < 0.24) { x = 0; y = 0; }
  if (gp.buttons[14] && gp.buttons[14].pressed) { x = -1; }
  if (gp.buttons[15] && gp.buttons[15].pressed) { x = 1; }
  if (gp.buttons[12] && gp.buttons[12].pressed) { y = -1; }
  if (gp.buttons[13] && gp.buttons[13].pressed) { y = 1; }
  var m = Math.sqrt(x * x + y * y);
  if (m > 1) { x /= m; y /= m; }
  pad.x = x; pad.y = y;

  // botoes (borda de subida)
  var bA = padJust(gp, 0), bB = padJust(gp, 1), bX = padJust(gp, 2);
  var bStart = padJust(gp, 9);
  var dLeft = padJust(gp, 14), dRight = padJust(gp, 15);
  var prev = [];
  for (i = 0; i < gp.buttons.length; i++) { prev[i] = !!gp.buttons[i].pressed; }
  pad.prev = prev;

  if (state === "MENU") {
    if (dLeft)  { diffIndex = (diffIndex + 2) % 3; }
    if (dRight) { diffIndex = (diffIndex + 1) % 3; }
    if (bA || bStart) { startMatch(); }
    return;
  }
  if (state === "END") {
    if (bA || bStart) { startMatch(); }
    else if (bB) { state = "MENU"; }
    return;
  }
  if (state === "PLAY") {
    if (bStart) { paused = !paused; return; }
    if (paused) { if (bA || bB || bX) { paused = false; } return; }
    if (bA) { actionPass(); }
    if (bB || bX) { actionShoot(); }
  }
}

function inputDir() {
  var x = 0, y = 0;
  if (keys["arrowleft"] || keys["a"])  { x -= 1; }
  if (keys["arrowright"] || keys["d"]) { x += 1; }
  if (keys["arrowup"] || keys["w"])    { y -= 1; }
  if (keys["arrowdown"] || keys["s"])  { y += 1; }
  if (joy.active) {
    var jx = (joy.x - joy.ox) / 52, jy = (joy.y - joy.oy) / 52;
    var m = Math.sqrt(jx * jx + jy * jy);
    if (m > 0.14) {
      if (m > 1) { jx /= m; jy /= m; }
      return { x: jx, y: jy };
    }
  }
  if (pad.on && Math.abs(pad.x) + Math.abs(pad.y) > 0.05) {
    return { x: pad.x, y: pad.y };
  }
  var km = Math.sqrt(x * x + y * y);
  if (km > 1) { x /= km; y /= km; }
  return { x: x, y: y };
}

function actionPass() {
  if (controlled && ball.owner === controlled) {
    var d = inputDir();
    var ax = d.x, ay = d.y;
    if (Math.abs(ax) + Math.abs(ay) < 0.1) { ax = controlled.fx; ay = controlled.fy; }
    doPass(controlled, ax, ay);
  }
}
function actionShoot() {
  if (!controlled) { return; }
  if (ball.owner === controlled) {
    var d = inputDir();
    var ax = d.x, ay = d.y;
    if (Math.abs(ax) + Math.abs(ay) < 0.1) { ax = controlled.fx; ay = controlled.fy; }
    doShootHuman(controlled, ax, ay);
  } else {
    startTackle(controlled);
  }
}

/* =====================================================================
   FISICA / ACOES
   ===================================================================== */
function attackGoal(team) { return { x: team === 0 ? F.x + F.w : F.x, y: H / 2 }; }
function ownGoal(team)    { return { x: team === 0 ? F.x : F.x + F.w, y: H / 2 }; }

function nearestOpp(p) {
  var best = null, bd = 1e9, i, q;
  for (i = 0; i < players.length; i++) {
    q = players[i];
    if (q.team === p.team || q.role === "gk") { continue; }
    var d = dist(p.x, p.y, q.x, q.y);
    if (d < bd) { bd = d; best = q; }
  }
  return { p: best, d: bd };
}
function openness(q) {
  var bd = 1e9, i, o;
  for (i = 0; i < players.length; i++) {
    o = players[i];
    if (o.team === q.team) { continue; }
    var d = dist(q.x, q.y, o.x, o.y);
    if (d < bd) { bd = d; }
  }
  return bd;
}
function nearestOutfield(team, x, y) {
  var best = null, bd = 1e9, i, q;
  for (i = 0; i < players.length; i++) {
    q = players[i];
    if (q.team !== team || q.role !== "out") { continue; }
    var d = dist(q.x, q.y, x, y);
    if (d < bd) { bd = d; best = q; }
  }
  return best;
}

function releaseBall(p) {
  ball.owner = null;
  ball.lastTouch = p;
  p.kickGrace = 0.4;
}

function doPass(p, ax, ay) {
  var am = Math.sqrt(ax * ax + ay * ay) || 1;
  ax /= am; ay /= am;
  var best = null, bs = -1e9, i, q;
  for (i = 0; i < players.length; i++) {
    q = players[i];
    if (q.team !== p.team || q === p || q.role !== "out") { continue; }
    var dx = q.x - p.x, dy = q.y - p.y;
    var dd = Math.sqrt(dx * dx + dy * dy) || 1;
    var dot = (dx / dd) * ax + (dy / dd) * ay;
    var s = dot * 100 - dd * 0.05 + openness(q) * 0.12;
    if (s > bs) { bs = s; best = q; }
  }
  if (!best) { return; }
  var d0 = dist(ball.x, ball.y, best.x, best.y);
  var spd = clamp(430 + d0 * 0.85, 450, 650);
  var t = d0 / spd;
  var tx = best.x + best.vx * t * 0.85;
  var ty = best.y + best.vy * t * 0.85;
  var dx2 = tx - ball.x, dy2 = ty - ball.y;
  var dd2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
  releaseBall(p);
  ball.vx = dx2 / dd2 * spd;
  ball.vy = dy2 / dd2 * spd;
  ball.receiver = best;
  ball.recvT = 1.4;
}

function doShoot(p, dx, dy, err) {
  var a = Math.atan2(dy, dx) + (rnd() - 0.5) * 2 * err;
  var spd = SHOOT_SPEED + rnd() * 70;
  releaseBall(p);
  ball.receiver = null;
  ball.vx = Math.cos(a) * spd;
  ball.vy = Math.sin(a) * spd;
}

function doShootHuman(p, ax, ay) {
  // leve assistencia de mira: se o chute aponta mais ou menos pro gol, puxa pro gol
  var g = attackGoal(p.team);
  var gy = GOAL_TOP + 30 + rnd() * (GOAL_H - 60);
  var gx2 = g.x - ball.x, gy2 = gy - ball.y;
  var gd = Math.sqrt(gx2 * gx2 + gy2 * gy2) || 1;
  gx2 /= gd; gy2 /= gd;
  var am = Math.sqrt(ax * ax + ay * ay) || 1;
  ax /= am; ay /= am;
  var dot = ax * gx2 + ay * gy2;
  var dx = ax, dy = ay;
  if (dot > 0.55) { dx = ax * 0.45 + gx2 * 0.55; dy = ay * 0.45 + gy2 * 0.55; }
  doShoot(p, dx, dy, 0.07);
}

function startTackle(p) {
  if (p.tackleCd > 0 || p.tackleT > 0) { return; }
  var d = (p === controlled) ? inputDir() : { x: 0, y: 0 };
  var dx = d.x, dy = d.y;
  if (Math.abs(dx) + Math.abs(dy) < 0.1) {
    // sem direcao: investe na direcao da bola
    dx = ball.x - p.x; dy = ball.y - p.y;
  }
  var m = Math.sqrt(dx * dx + dy * dy) || 1;
  p.tkx = dx / m; p.tky = dy / m;
  p.tackleT = TACKLE_TIME;
  p.tackleCd = TACKLE_CD;
}

function knockBall(p, dx, dy, spd) {
  var m = Math.sqrt(dx * dx + dy * dy) || 1;
  if (ball.owner) { ball.owner.kickGrace = 0.3; }
  ball.owner = null;
  ball.receiver = null;
  ball.vx = dx / m * spd + (rnd() - 0.5) * 60;
  ball.vy = dy / m * spd + (rnd() - 0.5) * 60;
  ball.lastTouch = p;
}

function setRestart(x, y, team, label) {
  ball.x = x; ball.y = y; ball.vx = 0; ball.vy = 0;
  ball.owner = null; ball.receiver = null;
  restartT = 0.9;
  restartLabel = label;
  graceTeam = team;
  graceT = 0; // comeca quando o apito termina
  trail.length = 0;
}

function checkGoalAndOut() {
  if (ball.owner || restartT > 0) { return; }
  var inMouth = ball.y > GOAL_TOP && ball.y < GOAL_BOT;
  // gol
  if (ball.x < F.x - ball.r && inMouth) { scoreGoal(1); return; }
  if (ball.x > F.x + F.w + ball.r && inMouth) { scoreGoal(0); return; }
  var lt = ball.lastTouch ? ball.lastTouch.team : 1;
  // lateral
  if (ball.y < F.y - ball.r) {
    setRestart(clamp(ball.x, F.x + 24, F.x + F.w - 24), F.y + 14, 1 - lt, "LATERAL");
    return;
  }
  if (ball.y > F.y + F.h + ball.r) {
    setRestart(clamp(ball.x, F.x + 24, F.x + F.w - 24), F.y + F.h - 14, 1 - lt, "LATERAL");
    return;
  }
  // linha de fundo (fora do gol)
  if (ball.x < F.x - ball.r) {
    if (lt === 0) { setRestart(F.x + 18, ball.y < H / 2 ? F.y + 18 : F.y + F.h - 18, 1, "ESCANTEIO"); }
    else { setRestart(F.x + 70, H / 2, 0, "TIRO DE META"); }
    return;
  }
  if (ball.x > F.x + F.w + ball.r) {
    if (lt === 1) { setRestart(F.x + F.w - 18, ball.y < H / 2 ? F.y + 18 : F.y + F.h - 18, 0, "ESCANTEIO"); }
    else { setRestart(F.x + F.w - 70, H / 2, 1, "TIRO DE META"); }
  }
}

function scoreGoal(team) {
  score[team]++;
  goalTeam = team;
  state = "GOAL";
  goalT = 2.2;
  shakeT = 0.45;
  spawnBurst(ball.x, ball.y, team === 0 ? COL_A : COL_B, 90);
  ball.vx *= 0.1; ball.vy *= 0.1;
}

function collidePost(px, py) {
  var dx = ball.x - px, dy = ball.y - py;
  var d = Math.sqrt(dx * dx + dy * dy);
  var min = ball.r + 5;
  if (d < min && d > 0.001) {
    var nx = dx / d, ny = dy / d;
    ball.x = px + nx * min; ball.y = py + ny * min;
    var dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) {
      ball.vx -= 2 * dot * nx;
      ball.vy -= 2 * dot * ny;
      ball.vx *= 0.7; ball.vy *= 0.7;
    }
  }
}

function updateBall(dt) {
  if (restartT > 0) { return; }
  var o = ball.owner;
  if (o) {
    if (o.role === "gk") {
      ball.x = o.x + (o.team === 0 ? o.r + ball.r + 3 : -(o.r + ball.r + 3));
      ball.y = o.y;
      ball.vx = 0; ball.vy = 0;
    } else {
      // conducao magnetica: bola gruda um pouco a frente
      var off = o.r + ball.r + 5;
      var tx = o.x + o.fx * off, ty = o.y + o.fy * off;
      var k = Math.min(1, dt * 16);
      ball.x += (tx - ball.x) * k;
      ball.y += (ty - ball.y) * k;
      ball.vx = o.vx; ball.vy = o.vy;
      if (dist(ball.x, ball.y, o.x, o.y) > 70) { ball.owner = null; }
    }
  } else {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    var f = Math.pow(BALL_FRICTION, dt);
    ball.vx *= f; ball.vy *= f;
    var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (sp < 6) { ball.vx = 0; ball.vy = 0; }
    // traves
    collidePost(F.x, GOAL_TOP); collidePost(F.x, GOAL_BOT);
    collidePost(F.x + F.w, GOAL_TOP); collidePost(F.x + F.w, GOAL_BOT);
    // fundo da rede
    if (ball.y > GOAL_TOP && ball.y < GOAL_BOT) {
      if (ball.x < F.x - GOAL_D + ball.r) { ball.x = F.x - GOAL_D + ball.r; ball.vx = Math.abs(ball.vx) * 0.25; }
      if (ball.x > F.x + F.w + GOAL_D - ball.r) { ball.x = F.x + F.w + GOAL_D - ball.r; ball.vx = -Math.abs(ball.vx) * 0.25; }
      ball.vy *= ball.x < F.x || ball.x > F.x + F.w ? 0.96 : 1;
    }
  }
  if (ball.recvT > 0) { ball.recvT -= dt; if (ball.recvT <= 0) { ball.receiver = null; } }
  // rastro
  var spd2 = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (spd2 > 60 || ball.owner) {
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 14) { trail.shift(); }
  } else if (trail.length) { trail.shift(); }
}

function captureAndSteal(dt) {
  if (restartT > 0) { return; }
  var i, p;
  if (!ball.owner) {
    for (i = 0; i < players.length; i++) {
      p = players[i];
      if (p.role === "gk") { continue; }
      if (p.kickGrace > 0) { continue; }
      if (graceT > 0 && p.team !== graceTeam) { continue; }
      var d = dist(p.x, p.y, ball.x, ball.y);
      var cr = p.r + ball.r + (ball.receiver === p ? 16 : 8);
      var bs = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      if (d < cr && (bs < 520 || ball.receiver === p)) {
        ball.owner = p; ball.receiver = null; ball.lastTouch = p;
        ball.vx = p.vx; ball.vy = p.vy;
        return;
      }
      if (d < p.r + ball.r) {
        // rebote no corpo
        var nx = (ball.x - p.x) / (d || 1), ny = (ball.y - p.y) / (d || 1);
        ball.x = p.x + nx * (p.r + ball.r + 0.5);
        ball.y = p.y + ny * (p.r + ball.r + 0.5);
        var dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) { ball.vx -= 1.6 * dot * nx; ball.vy -= 1.6 * dot * ny; }
        ball.vx = ball.vx * 0.7 + p.vx * 0.6;
        ball.vy = ball.vy * 0.7 + p.vy * 0.6;
        ball.lastTouch = p;
      }
    }
  } else {
    if (ball.owner.role === "gk") { return; } // goleiro com bola encaixada e intocavel
    var ot = 1 - ball.owner.team;
    for (i = 0; i < players.length; i++) {
      p = players[i];
      if (p.team !== ot || p.role === "gk") { continue; }
      if (graceT > 0 && p.team !== graceTeam) { continue; }
      var d2 = dist(p.x, p.y, ball.x, ball.y);
      if (p.tackleT > 0 && d2 < p.r + ball.r + 10) {
        knockBall(p, p.tkx, p.tky, 470);
        return;
      }
      var psp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      if (d2 < p.r + ball.r + 1 && psp > 60) {
        knockBall(p, ball.x - p.x, ball.y - p.y, 240);
        return;
      }
    }
  }
}

function steer(p, dt) {
  var mult = p.team === 1 ? cfg().speed : 1;
  var sp = P_SPEED * mult;
  var dvx = 0, dvy = 0;
  if (p.tackleT > 0) {
    p.vx = p.tkx * TACKLE_SPEED;
    p.vy = p.tky * TACKLE_SPEED;
    return;
  }
  if (p === controlled && state === "PLAY") {
    var d = inputDir();
    dvx = d.x * sp; dvy = d.y * sp;
  } else {
    var dx = p.tx - p.x, dy = p.ty - p.y;
    var dd = Math.sqrt(dx * dx + dy * dy);
    if (dd > 6) { dvx = dx / dd * sp; dvy = dy / dd * sp; }
  }
  var k = Math.min(1, dt * 9);
  p.vx += (dvx - p.vx) * k;
  p.vy += (dvy - p.vy) * k;
}

function movePlayers(dt) {
  var i, p;
  for (i = 0; i < players.length; i++) {
    p = players[i];
    p.tackleT = Math.max(0, p.tackleT - dt);
    p.tackleCd = Math.max(0, p.tackleCd - dt);
    p.kickGrace = Math.max(0, p.kickGrace - dt);
    if (p.role === "gk") { continue; }
    steer(p, dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.x = clamp(p.x, F.x + p.r, F.x + F.w - p.r);
    p.y = clamp(p.y, F.y + p.r, F.y + F.h - p.r);
    var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (sp > 30) { p.fx = p.vx / sp; p.fy = p.vy / sp; }
  }
  // separacao jogador x jogador
  for (i = 0; i < players.length; i++) {
    for (var j = i + 1; j < players.length; j++) {
      var a = players[i], b = players[j];
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var min = a.r + b.r;
      if (d < min && d > 0.001) {
        var nx = dx / d, ny = dy / d, push = (min - d) / 2;
        if (a.role !== "gk") { a.x -= nx * push; a.y -= ny * push; }
        if (b.role !== "gk") { b.x += nx * push; b.y += ny * push; }
      }
    }
  }
}

/* =====================================================================
   IA
   ===================================================================== */
function aiDecide(p) {
  var c = cfg();
  var atk = p.team === 0 ? 1 : -1;
  var g = attackGoal(p.team), og = ownGoal(p.team);
  var ownerTeam = ball.owner ? ball.owner.team : -1;
  var mate = null, i, q;
  for (i = 0; i < players.length; i++) {
    q = players[i];
    if (q.team === p.team && q.role === "out" && q !== p) { mate = q; }
  }
  var aggro = p.team === 1 ? c.aggro : 0.55;

  // bola parada: time beneficiado vai na bola, o outro recua
  if (restartT > 0 || (graceT > 0 && graceTeam !== p.team)) {
    if (graceTeam === p.team || restartT > 0 && graceTeam === p.team) {
      if (nearestOutfield(p.team, ball.x, ball.y) === p) { p.tx = ball.x; p.ty = ball.y; return; }
    }
    if (graceTeam !== p.team) {
      var ddx = og.x - ball.x, ddy = og.y - ball.y;
      var dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
      p.tx = ball.x + ddx / dl * 150;
      p.ty = clamp(ball.y + ddy / dl * 150, F.y + 30, F.y + F.h - 30);
      return;
    }
  }

  if (ball.owner === p) {
    // ATACAR com a bola
    var dg = dist(p.x, p.y, g.x, g.y);
    var no = nearestOpp(p);
    if (dg < 300 && Math.abs(p.y - H / 2) < 175 && rnd() < aggro + 0.2) {
      var gy = GOAL_TOP + 28 + rnd() * (GOAL_H - 56);
      doShoot(p, g.x - ball.x, gy - ball.y, p.team === 1 ? c.shootErr : 0.08);
      return;
    }
    if (no.d < 85 && mate && openness(mate) > 85 && rnd() < 0.85) {
      doPass(p, mate.x - p.x, mate.y - p.y);
      return;
    }
    var ty = p.y;
    if (no.p && no.d < 130) { ty = p.y + (p.y > no.p.y ? 70 : -70); }
    if (dg < 250) { ty = H / 2 + clamp(p.y - H / 2, -85, 85); }
    p.tx = clamp(p.x + atk * 170, F.x + 30, F.x + F.w - 30);
    p.ty = clamp(ty, F.y + 30, F.y + F.h - 30);
    return;
  }

  if (ownerTeam === p.team) {
    // apoio: buscar espaco livre adiantado
    var o = ball.owner;
    if (ball.receiver === p) { p.tx = ball.x + ball.vx * 0.25; p.ty = ball.y + ball.vy * 0.25; return; }
    p.tx = clamp(o.x + atk * 175, F.x + 40, F.x + F.w - 40);
    p.ty = o.y > H / 2 ? F.y + F.h * 0.28 : F.y + F.h * 0.72;
    return;
  }

  if (ownerTeam === 1 - p.team) {
    // DEFENDER
    var carrier = ball.owner;
    if (nearestOutfield(p.team, carrier.x, carrier.y) === p) {
      var dx = og.x - carrier.x, dy = og.y - carrier.y;
      var dd = Math.sqrt(dx * dx + dy * dy) || 1;
      p.tx = carrier.x + dx / dd * 10;
      p.ty = carrier.y + dy / dd * 10;
      if (dist(p.x, p.y, ball.x, ball.y) < 52 && p.tackleCd <= 0 && rnd() < aggro) {
        var bx = ball.x - p.x, by = ball.y - p.y;
        var bm = Math.sqrt(bx * bx + by * by) || 1;
        p.tkx = bx / bm; p.tky = by / bm;
        p.tackleT = TACKLE_TIME; p.tackleCd = TACKLE_CD;
      }
    } else {
      // marcar o adversario mais perigoso (o outro atacante)
      var opp = null;
      for (i = 0; i < players.length; i++) {
        q = players[i];
        if (q.team !== p.team && q.role === "out" && q !== carrier) { opp = q; }
      }
      if (!opp) { opp = carrier; }
      p.tx = opp.x + (og.x - opp.x) * 0.3;
      p.ty = opp.y + (og.y - opp.y) * 0.3;
    }
    return;
  }

  // DISPUTAR bola livre
  if (nearestOutfield(p.team, ball.x, ball.y) === p && !(graceT > 0 && graceTeam !== p.team)) {
    p.tx = ball.x + ball.vx * 0.18;
    p.ty = ball.y + ball.vy * 0.18;
  } else {
    p.tx = ball.x + (og.x - ball.x) * 0.5;
    p.ty = clamp(ball.y + (og.y - ball.y) * 0.4, F.y + 40, F.y + F.h - 40);
  }
}

function updateAI(dt) {
  var c = cfg(), i, p;
  for (i = 0; i < players.length; i++) {
    p = players[i];
    if (p.role !== "out") { continue; }
    if (p === controlled) { continue; }
    p.aiT -= dt;
    if (p.aiT <= 0) {
      aiDecide(p);
      var base = p.team === 1 ? c.react : 0.24;
      p.aiT = base * (0.7 + rnd() * 0.6);
    }
  }
}

function gkDistribute(gk) {
  var best = null, bs = -1e9, i, q;
  for (i = 0; i < players.length; i++) {
    q = players[i];
    if (q.team !== gk.team || q.role !== "out") { continue; }
    var s = openness(q) + Math.abs(q.x - gk.x) * 0.3;
    if (s > bs) { bs = s; best = q; }
  }
  if (best) { doPass(gk, best.x - gk.x, best.y - gk.y); }
  else { knockBall(gk, gk.team === 0 ? 1 : -1, 0, 400); }
  gk.catchCd = 1.6;
}

function updateGK(gk, dt) {
  var c = cfg();
  var gx = gk.team === 0 ? F.x + 20 : F.x + F.w - 20;
  gk.x += (gx - gk.x) * Math.min(1, dt * 10);
  gk.catchCd = Math.max(0, gk.catchCd - dt);

  // segura e repoe
  if (ball.owner === gk) {
    gk.hold -= dt;
    if (gk.hold <= 0) { gkDistribute(gk); }
  }

  // movimento vertical espelhando a bola
  var speed = gk.team === 1 ? c.gk : 235;
  var tyRaw = ball.y + ball.vy * 0.10;
  if (ball.owner && ball.owner.team === gk.team) { tyRaw = ball.y * 0.4 + H / 2 * 0.6; }
  var ty = clamp(tyRaw, H / 2 - AREA_H / 2, H / 2 + AREA_H / 2);
  var dy = ty - gk.y;
  var step = clamp(dy, -speed * dt, speed * dt);
  gk.y += step;
  gk.vx = 0; gk.vy = step / (dt || 0.016);

  // defesa por colisao / encaixe
  if (!ball.owner && restartT <= 0 && gk.catchCd <= 0 && !(graceT > 0 && graceTeam !== gk.team)) {
    var d = dist(gk.x, gk.y, ball.x, ball.y);
    var bs = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (d < gk.r + ball.r + 8 && bs < 680) {
      ball.owner = gk; ball.receiver = null; ball.lastTouch = gk;
      ball.vx = 0; ball.vy = 0;
      gk.hold = 0.9;
      spawnBurst(ball.x, ball.y, "#ffffff", 10);
    } else if (d < gk.r + ball.r) {
      // espalmada: rebote com leve aleatoriedade
      var nx = (ball.x - gk.x) / (d || 1), ny = (ball.y - gk.y) / (d || 1);
      ball.x = gk.x + nx * (gk.r + ball.r + 0.5);
      ball.y = gk.y + ny * (gk.r + ball.r + 0.5);
      var dot = ball.vx * nx + ball.vy * ny;
      if (dot < 0) { ball.vx -= 1.7 * dot * nx; ball.vy -= 1.7 * dot * ny; }
      ball.vx *= 0.55; ball.vy *= 0.55;
      ball.vy += (rnd() - 0.5) * 130;
      ball.lastTouch = gk;
      shakeT = Math.max(shakeT, 0.12);
    }
  }
}

function updateControl() {
  if (ball.owner && ball.owner.team === 0 && ball.owner.role === "out") {
    controlled = ball.owner;
    return;
  }
  var best = nearestOutfield(0, ball.x, ball.y);
  if (!best || best === controlled) { return; }
  if (!controlled || controlled.role !== "out") { controlled = best; return; }
  var dBest = dist(best.x, best.y, ball.x, ball.y);
  var dCur = dist(controlled.x, controlled.y, ball.x, ball.y);
  if (dBest < dCur - 24) { controlled = best; }
}

/* =====================================================================
   PARTICULAS / EFEITOS
   ===================================================================== */
function spawnBurst(x, y, col, n) {
  for (var i = 0; i < n; i++) {
    var a = rnd() * Math.PI * 2, sp = 60 + rnd() * 320;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + rnd() * 0.8, max: 1.3,
      col: col, r: 1.5 + rnd() * 3
    });
  }
}
function updateParticles(dt) {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.97; p.vy *= 0.97;
  }
}

/* =====================================================================
   LOOP DE JOGO
   ===================================================================== */
function updatePlay(dt) {
  if (paused) { return; }
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; state = "END"; return; }

  if (restartT > 0) {
    restartT -= dt;
    if (restartT <= 0) { graceT = 1.3; }
  }
  if (graceT > 0 && restartT <= 0) { graceT -= dt; }

  updateControl();
  updateAI(dt);
  movePlayers(dt);
  updateGK(players[0], dt);
  updateGK(players[3], dt);
  captureAndSteal(dt);
  updateBall(dt);
  checkGoalAndOut();
  updateParticles(dt);
  shakeT = Math.max(0, shakeT - dt);

  // carrinho pega bola livre tambem
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    if (p.tackleT > 0 && !ball.owner && restartT <= 0 &&
        !(graceT > 0 && p.team !== graceTeam) &&
        dist(p.x, p.y, ball.x, ball.y) < p.r + ball.r + 8) {
      knockBall(p, p.tkx, p.tky, 380);
    }
  }
}

function update(dt) {
  if (state === "MENU") { menuTime += dt; updateParticles(dt); return; }
  if (state === "PLAY") { updatePlay(dt); return; }
  if (state === "GOAL") {
    goalT -= dt;
    updateParticles(dt);
    shakeT = Math.max(0, shakeT - dt);
    if (goalT <= 0) {
      resetPositions(1 - goalTeam);
      state = "PLAY";
    }
    return;
  }
  if (state === "END") { updateParticles(dt); }
}

/* =====================================================================
   RENDER
   ===================================================================== */
function resize() {
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  scale = Math.min(cssW / W, cssH / H);
  ox = (cssW - W * scale) / 2;
  oy = (cssH - H * scale) / 2;
  hudRect.w = 270; hudRect.h = 70;
  hudRect.x = cssW / 2 - 135; hudRect.y = 0;
  btnShoot.x = cssW - 88;  btnShoot.y = cssH - 96;
  btnPass.x  = cssW - 206; btnPass.y  = cssH - 156;
  buildField();
}

function neonPath(c, color, width, blur, fn) {
  c.save();
  c.strokeStyle = color;
  c.lineWidth = width;
  c.shadowColor = color;
  c.shadowBlur = blur;
  c.beginPath();
  fn(c);
  c.stroke();
  c.shadowBlur = blur * 0.35;
  c.stroke();
  c.restore();
}

function buildField() {
  fieldCv.width = canvas.width;
  fieldCv.height = canvas.height;
  var c = fieldCv.getContext("2d");
  var blur = 11 * scale * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = "#04050c";
  c.fillRect(0, 0, cssW, cssH);
  c.translate(ox, oy);
  c.scale(scale, scale);
  // piso da quadra
  c.fillStyle = "#0a0d1c";
  c.fillRect(F.x, F.y, F.w, F.h);
  c.fillStyle = "rgba(0,229,255,0.028)";
  for (var i = 0; i < 8; i += 2) { c.fillRect(F.x + i * F.w / 8, F.y, F.w / 8, F.h); }
  // redes
  c.save();
  c.strokeStyle = "rgba(255,255,255,0.18)";
  c.lineWidth = 1;
  var n;
  for (n = 0; n <= 5; n++) {
    c.beginPath(); c.moveTo(F.x - GOAL_D + n * GOAL_D / 5, GOAL_TOP); c.lineTo(F.x - GOAL_D + n * GOAL_D / 5, GOAL_BOT); c.stroke();
    c.beginPath(); c.moveTo(F.x + F.w + n * GOAL_D / 5, GOAL_TOP); c.lineTo(F.x + F.w + n * GOAL_D / 5, GOAL_BOT); c.stroke();
  }
  for (n = 0; n <= 6; n++) {
    var yy = GOAL_TOP + n * GOAL_H / 6;
    c.beginPath(); c.moveTo(F.x - GOAL_D, yy); c.lineTo(F.x, yy); c.stroke();
    c.beginPath(); c.moveTo(F.x + F.w, yy); c.lineTo(F.x + F.w + GOAL_D, yy); c.stroke();
  }
  c.restore();
  // linhas principais (ciano)
  neonPath(c, COL_A, 3, blur, function (cc) { cc.rect(F.x, F.y, F.w, F.h); });
  // meio de quadra (magenta)
  neonPath(c, COL_B, 3, blur, function (cc) {
    cc.moveTo(W / 2, F.y); cc.lineTo(W / 2, F.y + F.h);
    cc.moveTo(W / 2 + 60, H / 2);
    cc.arc(W / 2, H / 2, 60, 0, Math.PI * 2);
  });
  // areas (arcos de 6m)
  neonPath(c, COL_A, 2.5, blur * 0.8, function (cc) {
    cc.moveTo(F.x, GOAL_TOP - 30);
    cc.arc(F.x, H / 2, 105, -Math.PI / 2 * 0.78, Math.PI / 2 * 0.78);
    cc.moveTo(F.x + F.w, GOAL_TOP - 30);
    cc.arc(F.x + F.w, H / 2, 105, Math.PI - Math.PI / 2 * 0.78, Math.PI + Math.PI / 2 * 0.78);
  });
  // marcas de penalti e centro
  c.fillStyle = COL_B;
  c.beginPath(); c.arc(W / 2, H / 2, 4, 0, Math.PI * 2); c.fill();
  c.fillStyle = COL_A;
  c.beginPath(); c.arc(F.x + 105, H / 2, 3, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(F.x + F.w - 105, H / 2, 3, 0, Math.PI * 2); c.fill();
  // arcos de escanteio
  neonPath(c, COL_A, 2, blur * 0.6, function (cc) {
    cc.moveTo(F.x + 12, F.y); cc.arc(F.x, F.y, 12, 0, Math.PI / 2);
    cc.moveTo(F.x + F.w, F.y + 12); cc.arc(F.x + F.w, F.y, 12, Math.PI / 2, Math.PI);
    cc.moveTo(F.x + 12, F.y + F.h); cc.arc(F.x, F.y + F.h, 12, -Math.PI / 2, 0);
    cc.moveTo(F.x + F.w - 12, F.y + F.h); cc.arc(F.x + F.w, F.y + F.h, 12, Math.PI, Math.PI * 1.5);
  });
  // traves (amarelo)
  neonPath(c, COL_BALL, 4, blur, function (cc) {
    cc.moveTo(F.x, GOAL_TOP); cc.lineTo(F.x - GOAL_D, GOAL_TOP); cc.lineTo(F.x - GOAL_D, GOAL_BOT); cc.lineTo(F.x, GOAL_BOT);
    cc.moveTo(F.x + F.w, GOAL_TOP); cc.lineTo(F.x + F.w + GOAL_D, GOAL_TOP); cc.lineTo(F.x + F.w + GOAL_D, GOAL_BOT); cc.lineTo(F.x + F.w, GOAL_BOT);
  });
}

function worldTransform() {
  var sx = 0, sy = 0;
  if (shakeT > 0) {
    sx = (rnd() - 0.5) * 10 * shakeT;
    sy = (rnd() - 0.5) * 10 * shakeT;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(ox + sx * scale, oy + sy * scale);
  ctx.scale(scale, scale);
}
function uiTransform() { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

function drawScene() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(fieldCv, 0, 0);
  worldTransform();
  var blur = 10 * scale * dpr;
  var i, p;

  // marca de bola parada
  if (restartT > 0 || (graceT > 0 && !ball.owner)) {
    var pul = 14 + Math.sin(performance.now() / 110) * 4;
    ctx.save();
    ctx.strokeStyle = graceTeam === 0 ? COL_A : COL_B;
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, pul, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // rastro da bola
  for (i = 0; i < trail.length; i++) {
    var t = trail[i], a = (i + 1) / trail.length;
    ctx.fillStyle = "rgba(255,225,77," + (a * 0.28).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(t.x, t.y, ball.r * a * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }

  // jogadores
  for (i = 0; i < players.length; i++) {
    p = players[i];
    var col = p.team === 0 ? COL_A : COL_B;
    // indicador do jogador controlado
    if (p === controlled && (state === "PLAY" || state === "GOAL")) {
      ctx.save();
      ctx.strokeStyle = "#ffffff";
      ctx.globalAlpha = 0.9;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 7, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - p.r - 22);
      ctx.lineTo(p.x - 7, p.y - p.r - 32);
      ctx.lineTo(p.x + 7, p.y - p.r - 32);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = blur;
    ctx.fillStyle = p.tackleT > 0 ? "#ffffff" : col;
    ctx.globalAlpha = p.role === "gk" ? 0.95 : 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.55, 0, Math.PI * 2); ctx.fill();
    if (p.role === "gk") {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.55, 0, Math.PI * 2); ctx.stroke();
    } else {
      // nariz de direcao
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(p.x + p.fx * p.r * 0.75, p.y + p.fy * p.r * 0.75, 3.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // bola
  ctx.save();
  ctx.shadowColor = COL_BALL;
  ctx.shadowBlur = blur;
  ctx.fillStyle = COL_BALL;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath(); ctx.arc(ball.x - 2, ball.y - 2, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // particulas
  for (i = 0; i < particles.length; i++) {
    var pa = particles[i];
    ctx.save();
    ctx.globalAlpha = clamp(pa.life / pa.max, 0, 1);
    ctx.fillStyle = pa.col;
    ctx.shadowColor = pa.col;
    ctx.shadowBlur = blur * 0.5;
    ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // apito / nome da reposicao
  if (restartT > 0) {
    ctx.save();
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 26px Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = graceTeam === 0 ? COL_A : COL_B;
    ctx.shadowBlur = blur;
    ctx.fillText(restartLabel, W / 2, F.y + 90);
    ctx.restore();
  }
}

function fmtTime(s) {
  s = Math.max(0, Math.ceil(s));
  var m = Math.floor(s / 60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawHUD() {
  uiTransform();
  var x = hudRect.x, w = hudRect.w;
  ctx.save();
  ctx.fillStyle = "rgba(4,6,14,0.82)";
  roundRect(ctx, x, -16, w, hudRect.h + 16, 14);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,229,255,0.5)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.textAlign = "center";
  ctx.fillStyle = COL_A;
  ctx.font = "800 24px Helvetica, Arial, sans-serif";
  ctx.fillText("VOCÊ", x + w * 0.2, 28);
  ctx.fillStyle = COL_B;
  ctx.fillText("CPU", x + w * 0.8, 28);
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 30px Helvetica, Arial, sans-serif";
  ctx.fillText(score[0] + " - " + score[1], x + w / 2, 30);
  ctx.fillStyle = timeLeft < 30 ? "#ff5252" : "rgba(255,255,255,0.9)";
  ctx.font = "700 20px Helvetica, Arial, sans-serif";
  ctx.fillText(fmtTime(timeLeft), x + w / 2, 56);
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = "600 10px Helvetica, Arial, sans-serif";
  ctx.fillText("❚❚ toque para pausar", x + w / 2, 68);
  ctx.restore();
}

function drawTouchUI() {
  if (!touchSeen || state !== "PLAY") { return; }
  uiTransform();
  ctx.save();
  // joystick
  if (joy.active) {
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 58, 0, Math.PI * 2); ctx.fill();
    var dx = joy.x - joy.ox, dy = joy.y - joy.oy;
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m > 52) { dx = dx / m * 52; dy = dy / m * 52; }
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = COL_A;
    ctx.beginPath(); ctx.arc(joy.ox + dx, joy.oy + dy, 30, 0, Math.PI * 2); ctx.fill();
  }
  // botoes
  var hasBall = controlled && ball.owner === controlled;
  drawButton(btnPass, "PASSE", COL_A, btnPass.on, 1);
  var cdFrac = controlled ? controlled.tackleCd / TACKLE_CD : 0;
  drawButton(btnShoot, hasBall ? "CHUTE" : "DESARME", COL_B, btnShoot.on, hasBall ? 1 : 1 - cdFrac);
  ctx.restore();
}

function drawButton(b, label, col, pressed, readyFrac) {
  ctx.globalAlpha = pressed ? 0.85 : 0.4;
  ctx.fillStyle = pressed ? col : "rgba(255,255,255,0.14)";
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.95;
  ctx.strokeStyle = col;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(readyFrac, 0, 1));
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 " + (label.length > 6 ? 13 : 16) + "px Helvetica, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, b.x, b.y);
  ctx.textBaseline = "alphabetic";
}

function drawPanelButton(r, label, col, big) {
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  roundRect(ctx, r.x, r.y, r.w, r.h, 14);
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = col;
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 " + (big ? 26 : 19) + "px Helvetica, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
  ctx.textBaseline = "alphabetic";
  ctx.restore();
}

function drawMenu() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(fieldCv, 0, 0);
  uiTransform();
  ctx.save();
  ctx.fillStyle = "rgba(2,3,8,0.62)";
  ctx.fillRect(0, 0, cssW, cssH);
  var cx = cssW / 2;
  var pulse = 0.75 + Math.sin(menuTime * 3) * 0.25;
  ctx.textAlign = "center";
  ctx.fillStyle = COL_A;
  ctx.shadowColor = COL_A;
  ctx.shadowBlur = 26;
  ctx.font = "900 " + Math.min(72, cssW / 9) + "px Helvetica, Arial, sans-serif";
  ctx.fillText("FUTSAL", cx, cssH * 0.24);
  ctx.fillStyle = COL_B;
  ctx.shadowColor = COL_B;
  ctx.fillText("NEON", cx, cssH * 0.24 + Math.min(72, cssW / 9) * 0.95);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.font = "600 15px Helvetica, Arial, sans-serif";
  ctx.fillText("3x3 · partidas de 3 minutos", cx, cssH * 0.45);
  var ml = menuLayout(), i;
  for (i = 0; i < 3; i++) {
    var sel = i === diffIndex;
    var r = ml.diff[i];
    ctx.save();
    ctx.fillStyle = sel ? "rgba(0,229,255,0.22)" : "rgba(255,255,255,0.06)";
    roundRect(ctx, r.x, r.y, r.w, r.h, 12);
    ctx.fill();
    ctx.strokeStyle = sel ? COL_A : "rgba(255,255,255,0.3)";
    ctx.lineWidth = sel ? 3 : 1.5;
    if (sel) { ctx.shadowColor = COL_A; ctx.shadowBlur = 12; }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = sel ? "#ffffff" : "rgba(255,255,255,0.65)";
    ctx.font = "800 16px Helvetica, Arial, sans-serif";
    ctx.textBaseline = "middle";
    ctx.fillText(DIFF_LIST[i].label, r.x + r.w / 2, r.y + r.h / 2 + 1);
    ctx.textBaseline = "alphabetic";
    ctx.restore();
  }
  ctx.globalAlpha = pulse;
  drawPanelButton(ml.play, "JOGAR", COL_BALL, true);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.font = "500 12px Helvetica, Arial, sans-serif";
  ctx.fillText("Touch: joystick à esquerda · PASSE e CHUTE à direita", cx, cssH - 64);
  ctx.fillText("Teclado: WASD/setas mover · X passe · Z chute/desarme", cx, cssH - 46);
  ctx.fillText("Controle: analógico/d-pad mover · A passe · B/X chute/desarme · Start pausa", cx, cssH - 28);
  if (pad.on) {
    ctx.fillStyle = COL_A;
    ctx.font = "700 13px Helvetica, Arial, sans-serif";
    ctx.fillText("🎮 controle conectado", cx, cssH - 86);
  }
  ctx.restore();
}

function drawGoalOverlay() {
  uiTransform();
  ctx.save();
  var t = clamp((2.2 - goalT) / 0.35, 0, 1);
  var col = goalTeam === 0 ? COL_A : COL_B;
  ctx.translate(cssW / 2, cssH / 2);
  ctx.scale(0.4 + t * 0.6, 0.4 + t * 0.6);
  ctx.globalAlpha = t;
  ctx.textAlign = "center";
  ctx.fillStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = 36;
  ctx.font = "900 " + Math.min(96, cssW / 7) + "px Helvetica, Arial, sans-serif";
  ctx.fillText("GOL!", 0, 0);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffffff";
  ctx.font = "700 22px Helvetica, Arial, sans-serif";
  ctx.fillText(goalTeam === 0 ? "VOCÊ MARCOU!" : "GOL DA CPU", 0, 44);
  ctx.restore();
}

function drawEnd() {
  uiTransform();
  ctx.save();
  ctx.fillStyle = "rgba(2,3,8,0.78)";
  ctx.fillRect(0, 0, cssW, cssH);
  var cx = cssW / 2;
  var res = score[0] > score[1] ? "VITÓRIA!" : (score[0] < score[1] ? "DERROTA" : "EMPATE");
  var col = score[0] > score[1] ? COL_A : (score[0] < score[1] ? COL_B : COL_BALL);
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.font = "700 22px Helvetica, Arial, sans-serif";
  ctx.fillText("FIM DE JOGO", cx, cssH * 0.22);
  ctx.fillStyle = col;
  ctx.shadowColor = col;
  ctx.shadowBlur = 28;
  ctx.font = "900 " + Math.min(64, cssW / 8) + "px Helvetica, Arial, sans-serif";
  ctx.fillText(res, cx, cssH * 0.36);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffffff";
  ctx.font = "800 44px Helvetica, Arial, sans-serif";
  ctx.fillText(score[0] + "  -  " + score[1], cx, cssH * 0.49);
  var el = endLayout();
  drawPanelButton(el.rematch, "REVANCHE", COL_BALL, true);
  drawPanelButton(el.menu, "MENU", "rgba(255,255,255,0.6)", false);
  ctx.restore();
}

function drawPause() {
  uiTransform();
  ctx.save();
  ctx.fillStyle = "rgba(2,3,8,0.7)";
  ctx.fillRect(0, 0, cssW, cssH);
  ctx.textAlign = "center";
  ctx.fillStyle = COL_A;
  ctx.shadowColor = COL_A;
  ctx.shadowBlur = 24;
  ctx.font = "900 52px Helvetica, Arial, sans-serif";
  ctx.fillText("PAUSADO", cssW / 2, cssH / 2 - 10);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.font = "600 18px Helvetica, Arial, sans-serif";
  ctx.fillText("toque para continuar", cssW / 2, cssH / 2 + 28);
  ctx.restore();
}

function render() {
  if (state === "MENU") { drawMenu(); return; }
  drawScene();
  drawHUD();
  if (state === "PLAY") {
    drawTouchUI();
    if (paused) { drawPause(); }
  }
  if (state === "GOAL") { drawGoalOverlay(); }
  if (state === "END") { drawEnd(); }
}

/* loop principal */
var lastTs = 0;
function tick(ts) {
  if (!lastTs) { lastTs = ts; }
  var dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  pollGamepad();
  update(dt);
  render();
  requestAnimationFrame(tick);
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });
document.addEventListener("visibilitychange", function () {
  if (document.hidden && state === "PLAY") { paused = true; }
  lastTs = 0;
});

buildTeams();
resize();
requestAnimationFrame(tick);

/* gancho de teste/depuracao (inofensivo em producao) */
window.__NF = {
  getState: function () { return state; },
  startMatch: startMatch,
  step: function (dt) { update(dt); render(); },
  press: handlePress,
  release: handleRelease,
  ball: ball,
  getPlayers: function () { return players; },
  getControlled: function () { return controlled; },
  getScore: function () { return score.slice(); }
};
</script>
</body>
