<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --line:#30363d;
  --txt:#e6edf3; --mut:#8b949e; --acc:#58a6ff; --acc2:#1f6feb;
  --grn:#3fb950; --red:#f85149; --yel:#d29922; --pur:#bc8cff;
  --safe-b: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--txt); overflow:hidden; user-select:none;
  font-size:15px; line-height:1.4;
}
#app{height:100%; display:flex; flex-direction:column}
.topbar{
  background:linear-gradient(180deg,var(--bg2),var(--bg)); border-bottom:1px solid var(--line);
  padding:10px 14px; display:flex; align-items:center; gap:10px; min-height:54px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.topbar .club{display:flex; align-items:center; gap:9px; flex:1; min-width:0}
.topbar .club b{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .meta{font-size:11px; color:var(--mut)}
.topbar .cash{font-size:13px; font-weight:700; text-align:right}
.topbar .cash small{display:block; font-size:10px; color:var(--mut); font-weight:400}
.content{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 12px 86px}
.tabs{
  position:fixed; bottom:0; left:0; right:0; background:var(--bg2); border-top:1px solid var(--line);
  display:flex; padding-bottom:var(--safe-b); z-index:50; overflow-x:auto;
}
.tabs button{
  flex:1 0 auto; min-width:64px; background:none; border:none; color:var(--mut); padding:8px 4px 9px;
  font-size:10px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
}
.tabs button .ic{font-size:19px; line-height:1}
.tabs button.on{color:var(--acc)}
h2{font-size:18px; margin:4px 0 12px}
h3{font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px; font-weight:600}
.card{background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px}
.row{display:flex; align-items:center; gap:10px}
.btn{
  background:var(--acc2); color:#fff; border:none; border-radius:9px; padding:11px 16px; font-size:14px;
  font-weight:600; cursor:pointer; transition:filter .1s; touch-action:manipulation;
}
.btn:active{filter:brightness(.85)}
.btn.sec{background:var(--bg3); color:var(--txt); border:1px solid var(--line)}
.btn.grn{background:var(--grn)} .btn.red{background:var(--red)} .btn.yel{background:var(--yel); color:#000}
.btn.wide{width:100%; display:block} .btn:disabled{opacity:.4}
.btn.sm{padding:6px 10px; font-size:12px; border-radius:7px}
.pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700}
.crest{flex:0 0 auto; border-radius:6px}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:7px 5px; text-align:left}
thead th{color:var(--mut); font-size:10px; text-transform:uppercase; border-bottom:1px solid var(--line); font-weight:600}
tbody tr{border-bottom:1px solid var(--bg3)}
tbody tr.me{background:rgba(88,166,255,.10)}
.tc{text-align:center} .tr{text-align:right}
.ovr{font-weight:800; border-radius:6px; padding:2px 7px; font-size:13px; min-width:30px; display:inline-block; text-align:center}
.pos{font-size:10px; font-weight:700; border-radius:4px; padding:2px 5px; min-width:30px; display:inline-block; text-align:center}
.muted{color:var(--mut)} .small{font-size:12px} .xs{font-size:11px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.bar{height:6px; background:var(--bg3); border-radius:4px; overflow:hidden}
.bar>span{display:block; height:100%; background:var(--acc)}
.sel{background:var(--bg3); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px; font-size:14px; width:100%}
.flex{display:flex} .between{justify-content:space-between} .center{align-items:center} .wrap{flex-wrap:wrap}
.g{flex:1}
/* overlay/modal */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px}
.modal{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:16px; max-width:480px; width:100%; max-height:86vh; overflow-y:auto}
/* start screen */
.start{position:fixed; inset:0; background:radial-gradient(circle at 50% 0%,#1b2838,var(--bg)); z-index:200; overflow-y:auto; padding:24px 16px calc(40px + var(--safe-b))}
.start .logo{text-align:center; margin:18px 0 24px}
.start .logo h1{font-size:30px; letter-spacing:1px; background:linear-gradient(90deg,#58a6ff,#bc8cff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
.start .logo p{color:var(--mut); font-size:13px; margin-top:4px}
.clublist{max-height:48vh; overflow-y:auto; border:1px solid var(--line); border-radius:12px; background:var(--bg2)}
.clubrow{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--bg3); cursor:pointer}
.clubrow:active{background:var(--bg3)}
.clubrow.sel{background:rgba(88,166,255,.15)}
/* match */
.matchwrap{position:fixed; inset:0; background:var(--bg); z-index:150; display:flex; flex-direction:column}
.scoreboard{background:linear-gradient(180deg,#13233b,var(--bg2)); padding:16px 12px; padding-top:calc(16px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--line)}
.scoreline{display:flex; align-items:center; justify-content:center; gap:14px}
.scoreline .tm{flex:1; text-align:center; font-weight:700; font-size:14px}
.scoreline .sc{font-size:34px; font-weight:800; min-width:90px; text-align:center}
.clock{text-align:center; color:var(--yel); font-weight:700; margin-top:8px; font-size:15px}
.commentary{flex:1; overflow-y:auto; padding:12px}
.ev{padding:8px 10px; border-left:3px solid var(--line); margin-bottom:7px; font-size:13px; background:var(--bg2); border-radius:0 8px 8px 0}
.ev.goal{border-color:var(--grn); background:rgba(63,185,80,.12); font-weight:600}
.ev.card{border-color:var(--yel)} .ev.red{border-color:var(--red)}
.ev .min{color:var(--mut); font-weight:700; margin-right:6px}
.matchctrl{background:var(--bg2); border-top:1px solid var(--line); padding:10px 12px calc(10px + var(--safe-b)); display:flex; gap:8px}
.statbar{display:flex; align-items:center; gap:8px; font-size:11px; margin:3px 0}
.statbar .lbl{width:74px; color:var(--mut); text-align:center; flex:0 0 auto}
.statbar .b{flex:1; height:7px; background:var(--bg3); border-radius:4px; overflow:hidden; display:flex}
.statbar .b i{display:block; height:100%}
.tag{font-size:10px; padding:1px 5px; border-radius:4px; background:var(--bg3); color:var(--mut)}
.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--bg3); border:1px solid var(--line); padding:10px 16px; border-radius:10px; z-index:300; font-size:13px; max-width:88%; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.5)}
.swatch{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:middle}
input.sel::placeholder{color:var(--mut)}
.divider{height:1px; background:var(--line); margin:10px 0}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
.nowrap{white-space:nowrap}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.pitch{background:linear-gradient(180deg,#1a5e2e,#15522a); border-radius:12px; position:relative; aspect-ratio:2/3; border:2px solid #2a7a40; overflow:hidden}
.pitch .pl{position:absolute; transform:translate(-50%,-50%); text-align:center; width:54px}
.pitch .pl .dot{width:34px; height:34px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; border:2px solid #fff}
.pitch .pl .nm{font-size:9px; margin-top:1px; text-shadow:0 1px 2px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pitch .line{position:absolute; left:6%; right:6%; height:1px; background:rgba(255,255,255,.2)}
</style>
</head>

/* ---------- Estrutura de posições ---------- */
const POS_GROUPS = {GK:["GK"], DF:["CB","CB","CB","RB","LB"], MF:["DM","CM","CM","RM","LM"], FW:["CAM","RW","LW","ST","ST"]};
const POS_COLORS = {GK:"#d29922", DF:"#3fb950", MF:"#58a6ff", FW:"#f85149"};
function posGroup(p){ if(p==="GK")return"GK"; if(["CB","RB","LB","RWB","LWB"].includes(p))return"DF"; if(["DM","CM","CAM","RM","LM"].includes(p))return"MF"; return"FW"; }

/* ---------- Geração de jogadores ---------- */
let _pid = 1;
function genName(nat){ const n=NAMES[nat]||NAMES.BRA; return pick(n.f)+" "+pick(n.l); }
function ovrColor(o){ if(o>=85)return"#3fb950"; if(o>=78)return"#58a6ff"; if(o>=70)return"#d29922"; if(o>=60)return"#8b949e"; return"#6e7681"; }

function makePlayer(club, pos, baseOvr, opt){
  opt=opt||{};
  const nat = opt.nat || club.nat;
  const age = opt.age!=null?opt.age:ri(17,34);
  let ovr = clamp(Math.round(baseOvr + gauss()*3), 45, 93);
  // potencial: jovens têm mais; veteranos já realizaram
  let pot = ovr;
  if(age<=23) pot = clamp(ovr + ri(3,16) - Math.max(0,age-19)*2, ovr, 95);
  else if(age<=27) pot = clamp(ovr + ri(0,4), ovr, 95);
  const g = posGroup(pos);
  // atributos por setor coerentes com posição
  function a(base,spread){ return clamp(Math.round(ovr*base + gauss()*spread), 30, 99); }
  let atk,def,phy,tec,men;
  if(g==="GK"){ atk=a(.55,4); def=a(1.02,3); phy=a(.95,4); tec=a(.85,4); men=a(1.0,4); }
  else if(g==="DF"){ atk=a(.72,5); def=a(1.06,3); phy=a(1.0,4); tec=a(.9,5); men=a(.98,4); }
  else if(g==="MF"){ atk=a(.95,5); def=a(.9,5); phy=a(.95,4); tec=a(1.05,3); men=a(1.0,4); }
  else { atk=a(1.1,3); def=a(.62,6); phy=a(.95,5); tec=a(1.03,4); men=a(.95,5); }
  const foot = chance(.78)?"Direito":"Esquerdo";
  const cur = LEAGUES.find(l=>l.id===club.leagueId).cur;
  const value = playerValue(ovr,pot,age,cur);
  const wage = Math.round(value*rf(0.012,0.02)); // salário anual ~1.2-2% do valor
  return {
    id:_pid++, name: opt.name||genName(nat), nat, clubId:club.id, pos, posG:g,
    age, ovr, pot, foot, value, wage, contract: ri(1,4),
    atk,def,phy,tec,men,
    form:0, fitness:100, morale:ri(55,80), happy:70,
    g:0, a:0, apps:0, yc:0, rc:0, inj:0, ban:0,
    seasonStats:{g:0,a:0,apps:0}, peakAge: g==="GK"?31:(g==="DF"?29:28),
  };
}
function playerValue(ovr,pot,age,cur){
  // valor base em milhões EUR
  let v = Math.pow(Math.max(0,ovr-40)/10, 3.0)*0.45; // exponencial no overall
  if(age<=21) v*=1.5; else if(age<=24) v*=1.35; else if(age<=27) v*=1.15;
  else if(age>=31) v*=0.55; else if(age>=29) v*=0.8;
  v *= 1 + Math.max(0,pot-ovr)*0.03; // potencial agrega valor
  v = Math.max(0.2, v);
  let m = v*1_000_000;
  if(cur==="BRL") m*= 6.2; // conversão aproximada
  // arredonda
  if(m>=10_000_000) m=Math.round(m/500_000)*500_000;
  else if(m>=1_000_000) m=Math.round(m/100_000)*100_000;
  else m=Math.round(m/50_000)*50_000;
  return m;
}

function genSquad(club){
  const players=[];
  const rep=club.rep;
  // overall base do clube derivado da reputação
  const baseTop = clamp(Math.round(rep*0.78 + 18), 60, 90);
  // semente de estrelas reais
  const stars = STARS[club.name]||[];
  const used = {GK:0,DF:0,MF:0,FW:0};
  stars.forEach(s=>{ const [nm,pos,age,ovr]=s; const p=makePlayer(club,pos,ovr,{name:nm,age,nat:guessNat(club),ovrForce:ovr}); p.ovr=ovr; recalcFromOvr(p); players.push(p); used[posGroup(pos)]++; });
  // completa elenco até 25, distribuição por setor
  const target={GK:3,DF:8,MF:8,FW:6};
  const order=["GK","DF","MF","FW"];
  order.forEach(grp=>{
    const need = target[grp]-used[grp];
    for(let i=0;i<need;i++){
      const pos = pick(POS_GROUPS[grp]);
      // titulares melhores que reservas
      const tierOff = (i<2? rf(0,3): (i<4? rf(-4,0): rf(-9,-3)));
      const p=makePlayer(club,pos,baseTop+tierOff,{});
      players.push(p);
    }
  });
  return players;
}
function guessNat(club){ // jogadores estrangeiros em grandes clubes — simplificado para a nat base
  return club.nat;
}
function recalcFromOvr(p){
  const g=p.posG; const ovr=p.ovr;
  function a(base,spread){ return clamp(Math.round(ovr*base + gauss()*spread),30,99); }
  if(g==="GK"){ p.atk=a(.55,3); p.def=a(1.02,2); p.phy=a(.95,3); p.tec=a(.85,3); p.men=a(1.0,3); }
  else if(g==="DF"){ p.atk=a(.72,4); p.def=a(1.06,2); p.phy=a(1.0,3); p.tec=a(.9,4); p.men=a(.98,3); }
  else if(g==="MF"){ p.atk=a(.95,4); p.def=a(.9,4); p.phy=a(.95,3); p.tec=a(1.05,2); p.men=a(1.0,3); }
  else { p.atk=a(1.1,2); p.def=a(.62,5); p.phy=a(.95,4); p.tec=a(1.03,3); p.men=a(.95,4); }
}

    inbox:[],

  };

  G.leagues.forEach(L=>{ buildLeagueSchedule(L); initStandings(L); });

  saveGame(currentSlot());
  return G;
}

function myClub(){ return G.clubs.find(c=>c.id===G.clubId); }
function clubById(id){ return G.clubs.find(c=>c.id===id); }
function leagueById(id){ return G.leagues.find(l=>l.id===id); }
function clubPlayers(cid){ return G.players.filter(p=>p.clubId===cid); }
function leagueOf(club){ return leagueById(club.leagueId); }
function curSymbol(cur){ return cur==="BRL"?"R$":"€"; }

/* ---------- Calendário (turno-returno) ---------- */
function buildLeagueSchedule(L){
  const ids = L.clubIds.slice();
  if(ids.length%2!==0) ids.push(null); // bye
  const n=ids.length, rounds=n-1, half=n/2;
  const arr=ids.slice();
  const single=[];
  for(let r=0;r<rounds;r++){
    const games=[];
    for(let i=0;i<half;i++){
      const h=arr[i], a=arr[n-1-i];
      if(h!==null && a!==null){
        // alterna mando
        if(r%2===0) games.push([h,a]); else games.push([a,h]);
      }
    }
    single.push(games);
    // rotação (fixa primeiro)
    arr.splice(1,0,arr.pop());
  }
  // turno + returno (inverte mando)
  const full=[];
  single.forEach(g=>full.push(g));
  single.forEach(g=>full.push(g.map(m=>[m[1],m[0]])));
  G.fixtures[L.id]=full.map((games,i)=>({round:i+1, games:games.map(g=>({h:g[0],a:g[1],played:false,hs:0,as:0})) }));
}
function initStandings(L){
  L.clubIds.forEach(id=>{ const c=clubById(id); c.P=c.W=c.D=c.L=c.GF=c.GA=c.Pts=0; c.form=[]; });
  G.scorers[L.id]={};
}

const FORMATIONS = {
  "4-3-3":{DF:["LB","CB","CB","RB"],MF:["CM","DM","CM"],FW:["LW","ST","RW"]},
  "4-4-2":{DF:["LB","CB","CB","RB"],MF:["LM","CM","CM","RM"],FW:["ST","ST"]},

const FORM_SLOTS = {}; // posições incl. GK
Object.keys(FORMATIONS).forEach(f=>{ const o=FORMATIONS[f]; FORM_SLOTS[f]=["GK",...o.DF,...o.MF,...o.FW]; });

const MENT_MOD = {"Defensivo":-0.10,"Cauteloso":-0.05,"Equilibrado":0,"Ofensivo":0.07,"Total":0.13};

function autoPickLineup(){
  const c=myClub();
  const slots=FORM_SLOTS[G.tactics.formation];
  const pool=clubPlayers(c.id).filter(p=>p.inj<=0&&p.ban<=0).slice();
  const lineup=[];
  const usedIds=new Set();
  slots.forEach(slot=>{
    const grp=posGroup(slot);
    // melhor jogador disponível p/ o grupo, prioriza posição exata
    let best=null,bestScore=-1;
    pool.forEach(p=>{
      if(usedIds.has(p.id))return;
      let score=p.ovr;
      if(p.pos===slot)score+=8; else if(p.posG===grp)score+=3; else score-=8;
      score+=p.form*0.5;
      if(score>bestScore){bestScore=score;best=p;}
    });
    if(best){ lineup.push({slot,pid:best.id}); usedIds.add(best.id); }
  });
  G.tactics.lineup=lineup;
  // cobradores
  const att=lineup.map(l=>byId(l.pid)).filter(Boolean).sort((a,b)=>b.tec-a.tec);
  if(att[0]){ G.tactics.penaltyTaker=att[0].id; G.tactics.freekickTaker=att[0].id; G.tactics.cornerTaker=(att[1]||att[0]).id; }
}
function byId(pid){ return G.players.find(p=>p.id===pid); }
function startingXI(cid){
  if(cid===G.clubId){ return G.tactics.lineup.map(l=>byId(l.pid)).filter(Boolean); }
  // IA: melhores 11 por overall
  return clubPlayers(cid).filter(p=>p.inj<=0&&p.ban<=0).sort((a,b)=>b.ovr-a.ovr).slice(0,11);
}

/* ============================================================================
   FORÇA DE EQUIPE + SIMULAÇÃO
   ========================================================================== */
function teamStrength(cid, opts){
  opts=opts||{};
  const xi = opts.xi || startingXI(cid);
  if(xi.length===0) return {att:50,mid:50,def:50,ovr:50};
  let att=0,mid=0,def=0,gk=50,n=0;
  xi.forEach(p=>{
    const w = p.fitness/100 * (0.85+p.morale/600) * (1+p.form*0.01);
    if(p.posG==="GK"){ gk=p.def*w; }
    else if(p.posG==="DF"){ def+=p.def*w*1.1+p.phy*w*0.3; n++; }
    else if(p.posG==="MF"){ mid+=p.tec*w*0.6+p.men*w*0.2+p.atk*w*0.2; n++; }
    else { att+=p.atk*w*0.7+p.tec*w*0.3; n++; }
  });
  const fw = xi.filter(p=>p.posG==="FW").length||1;
  const mf = xi.filter(p=>p.posG==="MF").length||1;
  const df = xi.filter(p=>p.posG==="DF").length||1;
  att=att/fw; mid=mid/mf; def=(def/df)*0.7 + gk*0.3;
  const ovr=(att+mid+def)/3;
  return {att,mid,def,ovr};
}
function clubMentality(cid){
  if(cid===G.clubId) return G.tactics.mentality;
  // IA escolhe mentalidade pela força relativa (simplificado)
  return "Equilibrado";
}

/* Simulação rápida (background / IA) — retorna [golsCasa, golsFora, eventos?] */
function quickSim(hId,aId){
  const H=teamStrength(hId), A=teamStrength(aId);
  const hAdv=1.12;
  let hExp = baseGoals(H.att*hAdv, A.def, H.mid, A.mid)*hAdv;
  let aExp = baseGoals(A.att, H.def, A.mid, H.mid);
  hExp += MENT_MOD[clubMentality(hId)]*1.2;
  aExp += MENT_MOD[clubMentality(aId)]*1.2;
  hExp=clamp(hExp,0.2,4.5); aExp=clamp(aExp,0.15,4.2);
  return [poisson(hExp), poisson(aExp)];
}
function baseGoals(att,def,mid,omid){
  const diff=(att-def)+(mid-omid)*0.25;
  return clamp(1.25 + diff*0.045, 0.2, 4.0);
}
function poisson(lambda){
  // amostra Poisson (Knuth)
  const Lx=Math.exp(-lambda); let k=0,p=1;
  do{ k++; p*=rng(); }while(p>Lx);
  return k-1;
}

/* ---------- Resultado afeta tabela ---------- */
function applyResult(L, fx){
  const h=clubById(fx.h), a=clubById(fx.a);
  h.P++;a.P++; h.GF+=fx.hs;h.GA+=fx.as; a.GF+=fx.as;a.GA+=fx.hs;
  if(fx.hs>fx.as){ h.W++;a.L++;h.Pts+=3; h.form.push("V");a.form.push("D"); }
  else if(fx.hs<fx.as){ a.W++;h.L++;a.Pts+=3; a.form.push("V");h.form.push("D"); }
  else { h.D++;a.D++;h.Pts++;a.Pts++; h.form.push("E");a.form.push("E"); }
  if(h.form.length>5)h.form.shift(); if(a.form.length>5)a.form.shift();
}
function recordScorers(L, cid, names){
  // names: [{pid}]
  names.forEach(o=>{
    const p=byId(o.pid); if(!p)return;
    p.g++; p.seasonStats.g++;
    if(o.assist){ const ap=byId(o.assist); if(ap){ap.a++; ap.seasonStats.a++;} }
  });
}

/* ---------- Standings ordenadas ---------- */
function tableOf(L){
  return L.clubIds.map(clubById).slice().sort((x,y)=>
    y.Pts-x.Pts || (y.GF-y.GA)-(x.GF-x.GA) || y.GF-x.GF || x.name.localeCompare(y.name));
}

/* ============================================================================
   SIMULAÇÃO MINUTO-A-MINUTO (partida do jogador)
   ========================================================================== */
let MATCH=null;
function startMatch(fx, L, ctx){
  const hId=fx.h, aId=fx.a;
  const H=teamStrength(hId), A=teamStrength(aId);
  MATCH={
    fx, L, ctx:ctx||null, hId, aId, H, A,
    hs:0, as:0, min:0, events:[], stats:{hShots:0,aShots:0,hSog:0,aSog:0,hPos:50,hCorners:0,aCorners:0},
    speed:1, running:false, finished:false, half:1,
    scorers:{h:[],a:[]}, cards:{}, ratings:{},
    hXI:startingXI(hId).slice(), aXI:startingXI(aId).slice(),
    subsLeft:{[hId]:5,[aId]:5},
  };
  // momentum proporcional à força
  renderMatch();
}
function matchTick(){
  if(!MATCH||MATCH.finished)return;
  const M=MATCH;
  M.min++;
  // possse/ataque a cada minuto
  const hStr=M.H.att+M.H.mid*0.5, aStr=M.A.att+M.A.mid*0.5;
  const total=hStr+aStr;
  const hPos = hStr/total;
  M.stats.hPos = Math.round(M.stats.hPos*0.92 + hPos*100*0.08);
  // chance de ataque perigoso neste minuto
  const attChance=0.34;
  if(chance(attChance)){
    const home = chance(hPos*1.08/((hPos*1.08)+(1-hPos)));
    resolveAttack(home);
  }
  // eventos esporádicos: cartões/lesões
  if(chance(0.012)) genCard();
  if(chance(0.004)) genInjuryEvent();

  // fim de tempo
  if(M.min===45 && M.half===1){ M.half=1.5; addEv(45,"⏸️ Fim do primeiro tempo.","",""); pauseHalftime(); return; }
  if(M.min>=90){ endMatch(); return; }
  renderMatchLive();
}
function resolveAttack(home){
  const M=MATCH;
  const atkT = home?M.H:M.A, defT=home?M.A:M.H;
  const xi = home?M.hXI:M.aXI;
  if(home)M.stats.hShots++; else M.stats.aShots++;
  // probabilidade de gol
  const edge = (atkT.att - defT.def);
  let pGoal = clamp(0.10 + edge*0.006 + (home?0.012:0), 0.04, 0.45);
  const onTarget = chance(0.42 + edge*0.003);
  if(onTarget){ if(home)M.stats.hSog++; else M.stats.aSog++; }
  if(onTarget && chance(pGoal/0.42)){
    // GOL
    const scorer=pickScorer(xi);
    const assist=pickAssist(xi,scorer);
    if(home){M.hs++; M.scorers.h.push({pid:scorer.id,min:M.min});} else {M.as++; M.scorers.a.push({pid:scorer.id,min:M.min});}
    rate(scorer,+1.2); if(assist)rate(assist,+0.7);
    const tm = clubById(home?M.hId:M.aId).name;
    addEv(M.min, `⚽ GOOOL do ${tm}! ${scorer.name}${assist?" (assist. "+assist.name+")":""}. ${M.hs} x ${M.as}`, "goal");
    // registra gols no save
    scorer.g++; scorer.seasonStats.g++; if(assist){assist.a++; assist.seasonStats.a++;}
  } else if(onTarget){
    const gk = (home?M.aXI:M.hXI).find(p=>p.posG==="GK");
    if(chance(0.5)) addEv(M.min, `🧤 Defesaça! ${gk?gk.name:"O goleiro"} salva o ${clubById(home?M.aId:M.hId).name}.`,"");
    else addEv(M.min, `😮 Quase! Finalização perigosa do ${clubById(home?M.hId:M.aId).name}.`,"");
  } else {
    if(chance(0.3)){ if(home)M.stats.hCorners++; else M.stats.aCorners++; addEv(M.min,`Escanteio para o ${clubById(home?M.hId:M.aId).name}.`,""); }
  }
}
function pickScorer(xi){
  // pondera por capacidade ofensiva
  const w=xi.map(p=> (p.posG==="FW"?3:(p.posG==="MF"?1.4:(p.posG==="DF"?0.4:0.05))) * (p.atk/60));
  return weightedPick(xi,w);
}
function pickAssist(xi,scorer){
  if(chance(0.25))return null;
  const w=xi.map(p=> p.id===scorer.id?0 : (p.posG==="MF"?2.2:(p.posG==="FW"?1.6:(p.posG==="DF"?0.6:0))) * (p.tec/60));
  return weightedPick(xi,w);
}
function weightedPick(arr,w){
  let s=w.reduce((a,b)=>a+b,0); if(s<=0)return pick(arr);
  let r=rng()*s; for(let i=0;i<arr.length;i++){ r-=w[i]; if(r<=0)return arr[i]; }
  return arr[arr.length-1];
}
function genCard(){
  const M=MATCH; const home=chance(0.5);
  const xi=home?M.hXI:M.aXI;
  const cand=xi.filter(p=>p.posG!=="GK");
  const p=weightedPick(cand,cand.map(x=>x.posG==="DF"?2:(x.posG==="MF"?1.5:1)));
  if(!p)return;
  const red=chance(0.08);
  if(red){ addEv(M.min,`🟥 CARTÃO VERMELHO! ${p.name} (${clubById(home?M.hId:M.aId).name}) é expulso!`,"red"); rate(p,-1.5);
    if(home)M.hXI=M.hXI.filter(x=>x.id!==p.id); else M.aXI=M.aXI.filter(x=>x.id!==p.id);
    p.rc++; }
  else { addEv(M.min,`🟨 Amarelo para ${p.name} (${clubById(home?M.hId:M.aId).name}).`,"card"); p.yc++; }
}
function genInjuryEvent(){
  const M=MATCH; const home=chance(0.5);
  const xi=home?M.hXI:M.aXI; const p=pick(xi.filter(x=>x.posG!=="GK"));
  if(!p)return;
  addEv(M.min,`🚑 ${p.name} (${clubById(home?M.hId:M.aId).name}) sente uma lesão e pode precisar sair.`,"card");
}
function rate(p,d){ MATCH.ratings[p.id]=(MATCH.ratings[p.id]||6.0)+d; }
function addEv(min,text,cls){ MATCH.events.push({min,text,cls:cls||""}); }

let _matchTimer=null;
function playPause(){
  if(MATCH.finished)return;
  MATCH.running=!MATCH.running;
  if(MATCH.running) loopMatch(); else clearTimeout(_matchTimer);
  renderMatchControls();
}
function loopMatch(){
  if(!MATCH.running||MATCH.finished)return;
  matchTick();
  if(MATCH.half===1.5)return; // pausado p/ intervalo
  const delay = MATCH.speed===2?160:330;
  _matchTimer=setTimeout(loopMatch, delay);
}
function skipMatch(){
  MATCH.running=false; clearTimeout(_matchTimer);
  while(!MATCH.finished){ if(MATCH.half===1.5){ resumeFromHalftime(true); } matchTick(); if(MATCH.half===1.5 && MATCH.min===45){ resumeFromHalftime(true);} }
}
function pauseHalftime(){
  MATCH.running=false; clearTimeout(_matchTimer);
  renderHalftime();
}
function resumeFromHalftime(silent){
  MATCH.half=2; if(!silent){ MATCH.running=true; loopMatch(); }
  if(silent){ MATCH.min=45; }
}
function endMatch(){
  const M=MATCH; M.finished=true; M.running=false; clearTimeout(_matchTimer);
  M.fx.played=true; M.fx.hs=M.hs; M.fx.as=M.as;
  addEv(90, `⏱️ Fim de jogo! ${clubById(M.hId).name} ${M.hs} x ${M.as} ${clubById(M.aId).name}`, "goal");
  // aplica na tabela (apenas partidas de liga; copas resolvem fora)
  if(!M.ctx) applyResult(M.L, M.fx);
  // bilheteria do mandante
  const homeClub=clubById(M.hId);
  txn(homeClub, gateReceipts(homeClub, clubById(M.aId).rep), "Bilheteria vs "+clubById(M.aId).name, "gate");
  // estatísticas dos jogadores (apps, fitness)
  [...M.hXI,...M.aXI].forEach(p=>{ p.apps++; p.seasonStats.apps++; p.fitness=clamp(p.fitness-ri(8,18),20,100); });
  // cartões viram suspensão (acúmulo de 3 amarelos / vermelho)
  [...M.hXI,...M.aXI].forEach(p=>{ if(p.rc>0 && p.ban<=0){ p.ban=ri(1,2); p.rc=0; } else if(p.yc>0 && p.yc%3===0 && p.ban<=0){ p.ban=1; } });
  // moral conforme resultado (clube do jogador)
  const meHome=M.hId===G.clubId, win=(meHome?M.hs>M.as:M.as>M.hs), draw=M.hs===M.as;
  const myXI = meHome?M.hXI:M.aXI;
  const md = win?+6:(draw?0:-5);
  clubPlayers(G.clubId).forEach(p=>{ p.morale=clamp(p.morale+md+(myXI.includes(p)?2:0),10,99); });
  renderMatchEnd();
}

/* ---------- Avançar a rodada (após partida do jogador) ---------- */
function simulateRound(){
  // simula TODAS as ligas na rodada corrente, exceto a partida já jogada pelo jogador
  G.leagues.forEach(L=>{
    const sched=G.fixtures[L.id];
    const r = roundIndexFor(L);
    if(r>=sched.length)return;
    const round=sched[r];
    round.games.forEach(fx=>{
      if(fx.played)return;
      const [hs,as]=quickSim(fx.h,fx.a);
      fx.hs=hs; fx.as=as; fx.played=true;
      applyResult(L,fx);
      simStatsForGame(L,fx);
    });
  });
}
function roundIndexFor(L){
  const sched=G.fixtures[L.id];
  for(let i=0;i<sched.length;i++){ if(sched[i].games.some(g=>!g.played))return i; }
  return sched.length;
}
function simStatsForGame(L,fx){
  // distribui gols a artilheiros fictícios das equipes (para tabela de artilharia viva)
  assignGoals(fx.h,fx.hs); assignGoals(fx.a,fx.as);
}
function assignGoals(cid,n){
  if(n<=0)return;
  const xi=startingXI(cid);
  for(let i=0;i<n;i++){
    const s=pickScorer(xi); if(s){s.g++;s.seasonStats.g++;}
    if(chance(0.7)){ const a=pickAssist(xi,s); if(a){a.a++;a.seasonStats.a++;} }
  }
}

/* myFixture: próxima partida do clube do jogador */
function myNextFixture(){
  const c=myClub(); const L=leagueOf(c);
  const sched=G.fixtures[L.id];
  for(let i=0;i<sched.length;i++){
    const g=sched[i].games.find(g=>!g.played && (g.h===c.id||g.a===c.id));
    if(g) return {fx:g, L, round:i};
  }
  return null;
}
function seasonOver(){
  const c=myClub(); const L=leagueOf(c);
  return roundIndexFor(L)>=G.fixtures[L.id].length;
}

/* ============================================================================
   PERSISTÊNCIA (localStorage, slots, export/import)

const SAVE_PREFIX="fmmundial_save_";
let _slot=1;
function currentSlot(){ return _slot; }
function saveGame(slot){

}
function loadGame(slot){

  catch(e){ toast("Save corrompido."); return false; }
}
function listSaves(){

  for(let i=1;i<=5;i++){

function exportSave(){

function importSave(file){

  r.onload=e=>{ try{ G=JSON.parse(e.target.result); saveGame(_slot); render(); toast("Save importado!"); }catch(err){toast("Arquivo inválido");} };

/* ---------- Inbox ---------- */
function pushInbox(title,body,kind){ G.inbox.unshift({title,body,kind:kind||"info",read:false,date:G.date}); if(G.inbox.length>60)G.inbox.pop(); }

/* ============================================================================
   FASE 2 — FINANÇAS + MERCADO DE TRANSFERÊNCIAS + EVOLUÇÃO
   ========================================================================== */
function txn(club, amount, desc, cat){
  club.balance += amount;
  if(cat && club.fin) club.fin[cat]=(club.fin[cat]||0)+Math.abs(amount);
  if(club.ledger){ club.ledger.unshift({amount,desc,cat,date:G.date,season:G.season}); if(club.ledger.length>40)club.ledger.pop(); }
}
function weeklyWageBill(cid){ return Math.round(clubPlayers(cid).reduce((s,p)=>s+p.wage,0)/52); }

/* Bilheteria — receita por jogo em casa */
function gateReceipts(club, oppRep){
  const L=leagueById(club.leagueId);
  const tablePos = tableOf(L).findIndex(c=>c.id===club.id);
  const perf = clamp(1 - tablePos*0.025, 0.55, 1);
  const draw = clamp((club.rep+oppRep)/200, 0.45, 1) * perf * rf(0.9,1.0);
  const attendance = Math.round(club.stadium * clamp(draw,0.35,1));
  const ticket = club.cur==="BRL"? rf(45,110): rf(28,75);
  return Math.round(attendance*ticket);
}

/* Janela de transferências aberta? */
function isWindowOpen(){
  const L=leagueOf(myClub());
  const r=roundIndexFor(L);
  const total=G.fixtures[L.id].length;
  const mid=Math.floor(total/2);
  if(r<=2){ G.window="Janela de pré-temporada"; return true; }
  if(r>=mid-1 && r<=mid+1){ G.window="Janela de meio de ano"; return true; }
  G.window="Janela fechada"; return false;
}

/* Decisão do clube vendedor sobre uma proposta de COMPRA */
function clubAcceptsFee(seller, player, fee){
  const ask = askingPrice(player);
  if(fee>=ask) return {ok:true};
  if(fee>=ask*0.85 && chance(0.5)) return {ok:true};
  // contrapropõe
  if(fee>=player.value*0.7) return {ok:false, counter:Math.round(ask*rf(0.92,1.0))};
  return {ok:false, counter:ask};
}
function askingPrice(player){
  // clubes pedem prêmio sobre o valor, maior p/ titulares jovens
  let mult = 1.15;
  if(player.age<=23) mult+=0.25;
  if(player.ovr>=82) mult+=0.2;
  if(player.pot-player.ovr>=6) mult+=0.15;
  return Math.round(player.value*mult);
}
/* Decisão do JOGADOR sobre proposta salarial e de jogar no clube */
function playerAcceptsMove(player, buyer, wageOffer){
  const better = wageOffer/Math.max(1,player.wage);
  const repGap = buyer.rep - clubById(player.clubId).rep;
  let p = 0.2;
  p += clamp((better-1)*0.9, -0.3, 0.6);
  p += clamp(repGap*0.012, -0.25, 0.4);
  if(buyer.rep>=85) p+=0.1;
  return chance(clamp(p,0.05,0.95));
}

/* Executa transferência permanente */
function doTransfer(player, buyer, fee, wage, contractYears){
  const seller=clubById(player.clubId);
  txn(buyer, -fee, `Compra de ${player.name}`, "buys");
  if(seller) txn(seller, +fee, `Venda de ${player.name}`, "sales");
  player.clubId=buyer.id; player.wage=wage; player.contract=contractYears||3;
  player.listed=false; player.loanFrom=null;
  G.transferLog.unshift({pl:player.name, from:seller?seller.name:"—", to:buyer.name, fee, season:G.season, cur:buyer.cur});
  if(G.transferLog.length>50)G.transferLog.pop();
}
/* Empréstimo */
function doLoan(player, buyer, buyOption){
  const seller=clubById(player.clubId);
  player.loanFrom=seller.id; player.loanBuy=buyOption||0;
  player.clubId=buyer.id; player.listed=false;
  G.transferLog.unshift({pl:player.name, from:seller.name, to:buyer.name+" (emp.)", fee:0, season:G.season, cur:buyer.cur});
}

/* Mercado vivo: clubes IA negociam entre si quando a janela está aberta */
function runAIMarket(intensity){
  intensity=intensity||ri(2,5);
  for(let t=0;t<intensity;t++){
    // comprador: clube com bom caixa e boa reputação
    const buyers=G.clubs.filter(c=>c.id!==G.clubId && c.balance>0).sort((a,b)=>b.rep-a.rep);
    const buyer=buyers[ri(0,Math.min(12,buyers.length-1))];
    if(!buyer)continue;
    const buyerSquad=clubPlayers(buyer.id);
    if(buyerSquad.length>27)continue;
    const buyerAvg=buyerSquad.reduce((s,p)=>s+p.ovr,0)/Math.max(1,buyerSquad.length);
    // alvo: jogador de outro clube que melhora o comprador e cabe no orçamento
    const budget=buyer.balance*0.6;
    const pool=G.players.filter(p=>p.clubId!==buyer.id && p.clubId!==G.clubId && !p.loanFrom &&
       p.ovr>buyerAvg-2 && askingPrice(p)<=budget);
    if(pool.length===0)continue;
    const target=pick(pool.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,30));
    const seller=clubById(target.clubId);
    if(!seller || clubPlayers(seller.id).length<=20)continue; // não esvazia elenco
    const fee=askingPrice(target);
    if(buyer.balance<fee)continue;
    const wage=Math.round(target.wage*rf(1.05,1.4));
    if(!playerAcceptsMove(target,buyer,wage))continue;
    doTransfer(target,buyer,fee,wage,ri(3,5));
  }
  // jogadores listados pelo MEU clube recebem propostas da IA
  clubPlayers(G.clubId).filter(p=>p.listed).forEach(p=>{
    if(!isWindowOpen())return;
    if(chance(0.5)){
      const buyer=pick(G.clubs.filter(c=>c.id!==G.clubId && c.rep>=clubById(p.clubId).rep-8 && c.balance>p.value));
      if(!buyer)return;
      const offer=Math.round(p.value*rf(0.85,1.2));
      pushInbox("💱 Proposta recebida", `${buyer.name} ofereceu ${fmtMoney(offer,myClub().cur)} por ${p.name}. Vá ao Mercado para responder.`, "info");
      p.pendingOffer={from:buyer.id, fee:offer};
    }
  });
}

/* ============================================================================
   FASE 3 — COMPETIÇÕES CONTINENTAIS, MUNDIAL DE CLUBES, COPA DO MUNDO
   ========================================================================== */
const PRIZE = { // por rodada vencida/atingida (em EUR base; BRL multiplica 6.2)
  UCL:18_000_000, UEL:6_000_000, LIB:8_000_000, SUL:3_000_000, CDB:4_000_000, CWC:25_000_000
};
function prizeFor(comp, club){ const base=PRIZE[comp.id]||1_000_000; return Math.round(base*(club.cur==="BRL"?6.2:1)*0.5); }

function leagueRank(leagueId, n, from){
  const L=leagueById(leagueId); if(!L)return [];
  const played=L.clubIds.some(id=>clubById(id).P>0);
  const order = played? tableOf(L).map(c=>c.id) : L.clubIds.slice().sort((a,b)=>clubById(b).rep-clubById(a).rep);
  return order.slice(from||0,(from||0)+n);
}
function dedupe(a){ const s=new Set(),o=[]; a.forEach(x=>{if(!s.has(x)){s.add(x);o.push(x);}}); return o; }
function powTrim(arr,size){ return arr.slice(0,size); }

function buildCompetitions(){
  G.comps=[];
  // ---- Champions League (liga suíça 36) ----
  let cl=[];
  ["ENG1","ESP1","ITA1","GER1","FRA1"].forEach(l=>cl.push(...leagueRank(l,4)));
  cl.push(...leagueRank("POR1",2),...leagueRank("NED1",2));
  ["ENG1","ESP1","ITA1","GER1","FRA1"].forEach(l=>cl.push(...leagueRank(l,2,4)));
  cl.push(...leagueRank("POR1",1,2),...leagueRank("NED1",1,2));
  cl=dedupe(cl); while(cl.length<36){ cl.push(...leagueRank("ENG1",1,4+cl.length%3)); cl=dedupe(cl); if(cl.length>50)break; }
  G.comps.push(makeSwiss("UCL","Champions League","EU",powTrim(cl,36)));
  // ---- Europa League (liga suíça 24) ----
  let el=[];
  ["ENG1","ESP1","ITA1","GER1","FRA1"].forEach(l=>el.push(...leagueRank(l,3,6)));
  el.push(...leagueRank("POR1",3,3),...leagueRank("NED1",3,3));
  el=dedupe(el.filter(id=>!cl.slice(0,36).includes(id)));
  while(el.length<24){ el.push(...leagueRank("ITA1",1,9+el.length%4)); el=dedupe(el); if(el.length>40)break; }
  G.comps.push(makeSwiss("UEL","Europa League","EU",powTrim(el,24)));
  // ---- Libertadores (mata-mata 16) ----
  let lib=dedupe([...leagueRank("BRA1",6),...leagueRank("ARG1",6),...leagueRank("BRA2",2),...leagueRank("ARG1",2,6)]);
  G.comps.push(makeKO("LIB","Libertadores","SA",powTrim(lib,16)));
  // ---- Sul-Americana (mata-mata 16) ----
  let sul=dedupe([...leagueRank("BRA1",4,6),...leagueRank("ARG1",4,8),...leagueRank("BRA2",4,2),...leagueRank("ARG1",4,12)]);
  G.comps.push(makeKO("SUL","Sul-Americana","SA",powTrim(sul,16)));
  // ---- Copa do Brasil (mata-mata 32) ----
  let cdb=dedupe([...leagueById("BRA1").clubIds, ...leagueRank("BRA2",12)]);
  G.comps.push(makeKO("CDB","Copa do Brasil","SA",powTrim(cdb,32)));
  // notifica participação do jogador
  G.comps.forEach(comp=>{ if(comp.teams.includes(G.clubId)) pushInbox("🏆 Classificado", `O ${myClub().name} disputará a ${comp.name} nesta temporada.`,"good"); });
}

function makeKO(id,name,conf,teams){
  teams=shuffle(teams.slice());
  const comp={id,name,conf,type:"ko",teams,stage:0,bracket:[],champion:null,out:false,done:false};
  // primeira rodada de confrontos
  comp.bracket.push(pairUp(teams));
  comp.roundNames=koRoundNames(teams.length);
  return comp;
}
function pairUp(ids){ const ties=[]; for(let i=0;i<ids.length;i+=2){ ties.push({h:ids[i],a:ids[i+1],hs:null,as:null,w:null}); } return ties; }
function koRoundNames(n){
  const names=[]; let cur=n;
  while(cur>1){ names.push(cur===2?"Final":cur===4?"Semifinal":cur===8?"Quartas":cur===16?"Oitavas":(cur+"-avos")); cur/=2; }
  return names;
}
function makeSwiss(id,name,conf,teams){
  const comp={id,name,conf,type:"swiss",teams:teams.slice(),stage:0,phase:"league",swissRound:0,
    table:{},swissFix:[],bracket:[],champion:null,out:false,done:false,roundNames:[]};
  teams.forEach(t=>comp.table[t]={P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
  // 8 rodadas de pareamentos aleatórios (sem repetir adversário quando possível)
  const used={}; teams.forEach(t=>used[t]=new Set());
  for(let r=0;r<8;r++){
    const pool=shuffle(teams.slice()); const games=[]; const taken=new Set();
    for(let i=0;i<pool.length;i++){
      const h=pool[i]; if(taken.has(h))continue;
      let a=null;
      for(let j=i+1;j<pool.length;j++){ const c=pool[j]; if(!taken.has(c)&&!used[h].has(c)){a=c;break;} }
      if(!a){ for(let j=i+1;j<pool.length;j++){ if(!taken.has(pool[j])){a=pool[j];break;} } }
      if(a){ taken.add(h);taken.add(a);used[h].add(a);used[a].add(h); games.push({h,a,hs:null,as:null}); }
    }
    comp.swissFix.push(games);
  }
  return comp;
}

/* avança UMA fase da competição; se interactive e o jogador estiver vivo nesta fase, joga sua partida */
function advanceComp(compId, interactive){
  const comp=G.comps.find(c=>c.id===compId); if(!comp||comp.done)return;
  if(comp.type==="swiss" && comp.phase==="league"){
    const games=comp.swissFix[comp.swissRound];
    const myGame=games.find(g=>g.h===G.clubId||g.a===G.clubId);
    if(interactive && myGame && !comp.out){
      // sim os outros jogos, depois joga o do jogador
      games.forEach(g=>{ if(g!==myGame){ const [hs,as]=quickSim(g.h,g.a); g.hs=hs;g.as=as; swissApply(comp,g); } });
      launchCompMatch(comp, myGame, ()=>{ swissApply(comp,myGame); afterSwissRound(comp); });
      return;
    }
    games.forEach(g=>{ if(g.hs===null){ const [hs,as]=quickSim(g.h,g.a); g.hs=hs;g.as=as; swissApply(comp,g); } });
    afterSwissRound(comp); return;
  }
  // fase mata-mata (ko comp ou swiss->ko)
  const round=comp.bracket[comp.stage];
  const myTie=round&&round.find(t=>(t.h===G.clubId||t.a===G.clubId)&&t.w===null);
  if(interactive && myTie && !comp.out){
    round.forEach(t=>{ if(t!==myTie && t.w===null) simTie(comp,t); });
    const home=myTie.h===G.clubId;
    launchCompMatch(comp, myTie, ()=>{ resolveTieFromMatch(comp,myTie); afterKORound(comp); });
    return;
  }
  round.forEach(t=>{ if(t.w===null) simTie(comp,t); });
  afterKORound(comp);
}
function swissApply(comp,g){
  const th=comp.table[g.h], ta=comp.table[g.a];
  th.P++;ta.P++; th.GF+=g.hs;th.GA+=g.as; ta.GF+=g.as;ta.GA+=g.hs;
  if(g.hs>g.as){th.W++;ta.L++;th.Pts+=3;} else if(g.hs<g.as){ta.W++;th.L++;ta.Pts+=3;} else {th.D++;ta.D++;th.Pts++;ta.Pts++;}
}
function afterSwissRound(comp){
  comp.swissRound++;
  if(comp.swissRound>=comp.swissFix.length){
    // monta mata-mata com os 16 melhores
    const ranked=comp.teams.slice().sort((a,b)=>{const A=comp.table[a],B=comp.table[b];return B.Pts-A.Pts||(B.GF-B.GA)-(A.GF-A.GA)||B.GF-A.GF;});
    const ko=ranked.slice(0,16);
    if(!ko.includes(G.clubId)&&comp.teams.includes(G.clubId)){ comp.out=true; pushInbox("❌ Eliminado",`O ${myClub().name} não avançou da fase de liga da ${comp.name}.`,"bad"); }
    // chaveamento 1x16, 2x15...
    const ties=[]; for(let i=0;i<8;i++){ ties.push({h:ko[i],a:ko[15-i],hs:null,as:null,w:null}); }
    comp.phase="ko"; comp.bracket=[ties]; comp.stage=0; comp.roundNames=koRoundNames(16);
    awardCompPrize(comp, ko);
  }
  saveGame();
}
function simTie(comp,t){
  let [hs,as]=quickSim(t.h,t.a);
  if(hs===as){ if(chance(0.5))hs++; else as++; } // sem empate no mata-mata
  t.hs=hs;t.as=as; t.w= hs>as?t.h:t.a;
}
function resolveTieFromMatch(comp,t){
  let hs=MATCH.hs, as=MATCH.as;
  if(hs===as){ // disputa de pênaltis simplificada
    if(chance( teamStrength(t.h).ovr/(teamStrength(t.h).ovr+teamStrength(t.a).ovr) )) hs+=1; else as+=1;
    pushInbox("🎯 Pênaltis",`A decisão da ${comp.name} foi para os pênaltis!`,"info");
  }
  t.hs=hs;t.as=as; t.w= hs>as?t.h:t.a;
}
function afterKORound(comp){
  const round=comp.bracket[comp.stage];
  // checa eliminação do jogador
  const myTie=round.find(t=>t.h===G.clubId||t.a===G.clubId);
  if(myTie && myTie.w!==G.clubId && !comp.out){ comp.out=true; pushInbox("❌ Eliminado",`O ${myClub().name} foi eliminado na ${comp.roundNames[comp.stage]} da ${comp.name}.`,"bad"); }
  const winners=round.map(t=>t.w);
  awardCompPrize(comp, winners);
  if(winners.length===1){
    comp.champion=winners[0]; comp.done=true;
    const ch=clubById(comp.champion);
    if(comp.champion===G.clubId){ G.trophies.unshift({name:comp.name,season:G.season}); pushInbox("🏆 CAMPEÃO!",`O ${myClub().name} é CAMPEÃO da ${comp.name} de ${G.season}!`,"good"); txn(myClub(),prizeFor(comp,myClub())*2,"Título "+comp.name,"prize"); }
    else pushInbox("🏆 Campeão da "+comp.name, `${ch.name} venceu a ${comp.name} de ${G.season}.`,"info");
    return;
  }
  comp.bracket.push(pairUp(winners)); comp.stage++;
  saveGame();
}
function awardCompPrize(comp, advancing){
  advancing.forEach(id=>{ const c=clubById(id); if(c) txn(c, prizeFor(comp,c), comp.name+" premiação", "prize"); });
}
function compStatusLabel(comp){
  if(comp.done) return "Campeão: "+clubById(comp.champion).name;
  if(comp.type==="swiss"&&comp.phase==="league") return "Fase de liga · Rodada "+(comp.swissRound+1)+"/8";
  return comp.roundNames[comp.stage]||"Mata-mata";
}
function playerInComp(comp){ return comp.teams.includes(G.clubId) && !comp.out && !comp.done; }
function playerHasMatchNow(comp){
  if(!playerInComp(comp))return false;
  if(comp.type==="swiss"&&comp.phase==="league"){ const g=comp.swissFix[comp.swissRound]; return g&&g.some(x=>x.h===G.clubId||x.a===G.clubId); }
  const round=comp.bracket[comp.stage]; return round&&round.some(t=>(t.h===G.clubId||t.a===G.clubId)&&t.w===null);
}

let _compCb=null;
function launchCompMatch(comp, tie, cb){
  _compCb=cb;
  const fx={h:tie.h,a:tie.a,hs:0,as:0,played:false};
  startMatch(fx, leagueById(myClub().leagueId), {comp:comp.id, tie});
}
function finishCompMatchFlow(){
  const cb=_compCb; _compCb=null;
  $("matchRoot").innerHTML=""; MATCH=null;

/* conclui automaticamente qualquer competição não finalizada (sim) */
function finishPendingComps(){
  (G.comps||[]).forEach(comp=>{
    let guard=0;
    while(!comp.done && guard++<60){
      if(comp.type==="swiss" && comp.phase==="league"){
        const games=comp.swissFix[comp.swissRound];
        games.forEach(g=>{ if(g.hs===null){ const [hs,as]=quickSim(g.h,g.a); g.hs=hs;g.as=as; swissApply(comp,g); } });
        afterSwissRound(comp);
      } else {
        const round=comp.bracket[comp.stage];
        round.forEach(t=>{ if(t.w===null) simTie(comp,t); });
        afterKORound(comp);
      }
    }
  });
}

function runClubWorldCup(){
  // reúne campeões continentais + grandes do mundo (8 times)
  const champs=[];
  ["UCL","LIB","UEL","SUL"].forEach(id=>{ const c=G.comps.find(x=>x.id===id); if(c&&c.champion)champs.push(c.champion); });
  // completa até 8 com os de maior reputação
  const extra=G.clubs.slice().sort((a,b)=>b.rep-a.rep).map(c=>c.id);
  let teams=dedupe([...champs,...extra]).slice(0,8);
  const cwc=makeKO("CWC","Mundial de Clubes","WORLD",teams);
  // simula direto (sem interativo p/ simplicidade)
  while(!cwc.done){ cwc.bracket[cwc.stage].forEach(t=>{if(t.w===null)simTie(cwc,t);}); afterKORoundCWC(cwc); }
  function afterKORoundCWC(comp){
    const round=comp.bracket[comp.stage]; const winners=round.map(t=>t.w); awardCompPrize(comp,winners);
    if(winners.length===1){ comp.champion=winners[0]; comp.done=true;
      const ch=clubById(comp.champion);
      if(comp.champion===G.clubId){ G.trophies.unshift({name:"Mundial de Clubes",season:G.season}); pushInbox("🌍 CAMPEÃO MUNDIAL!",`O ${myClub().name} é CAMPEÃO do MUNDO em ${G.season}!`,"good"); }
      else pushInbox("🌍 Mundial de Clubes",`${ch.name} é o campeão mundial de ${G.season}.`,"info");
    } else { comp.bracket.push(pairUp(winners)); comp.stage++; }
  }
  G.lastCWC={season:G.season,champion:cwc.champion,bracket:cwc.bracket,roundNames:cwc.roundNames};
}

/* ============================ COPA DO MUNDO ============================ */
const WC_NATIONS=[
  {nat:"BRA",name:"Brasil"},{nat:"ARG",name:"Argentina"},{nat:"FRA",name:"França"},{nat:"ENG",name:"Inglaterra"},
  {nat:"ESP",name:"Espanha"},{nat:"GER",name:"Alemanha"},{nat:"ITA",name:"Itália"},{nat:"POR",name:"Portugal"},
  {nat:"NED",name:"Holanda"},
];
const WC_FILLER=["Uruguai","Bélgica","Croácia","Marrocos","México","Colômbia","Japão"]; // selos gerados
function buildNationSquad(nat){
  // 23 melhores jogadores existentes daquela nacionalidade
  const pls=G.players.filter(p=>p.nat===nat).sort((a,b)=>b.ovr-a.ovr).slice(0,23);
  return pls;
}
function nationStrength(squad){
  const xi=squad.slice(0,11);
  if(!xi.length)return {ovr:55,att:55,mid:55,def:55};
  const ovr=xi.reduce((s,p)=>s+p.ovr,0)/xi.length;
  return {ovr,att:ovr,mid:ovr,def:ovr};
}
function runWorldCup(){
  const nations=[];
  WC_NATIONS.forEach(n=>{ const sq=buildNationSquad(n.nat); nations.push({id:"WC_"+n.nat,name:n.name,nat:n.nat,squad:sq,str:nationStrength(sq).ovr,colors:natColors(n.nat)}); });
  WC_FILLER.forEach((nm,i)=>{ const str=ri(72,80); nations.push({id:"WCF_"+i,name:nm,nat:"GEN",squad:[],str,colors:["#"+((1<<24)*rng()|0).toString(16).padStart(6,'0'),"#ffffff"]}); });
  // convocações: jogadores do MEU clube chamados → moral
  let called=[];
  WC_NATIONS.forEach(n=>{ buildNationSquad(n.nat).forEach(p=>{ if(p.clubId===G.clubId){ p.morale=clamp(p.morale+6,10,99); called.push(p.name+" ("+n.name+")"); } }); });
  if(called.length) pushInbox("🌎 Convocados!",`Jogadores do ${myClub().name} convocados para a Copa do Mundo: ${called.join(", ")}. A moral subiu!`,"good");
  // bracket de 16
  const teams=shuffle(nations).slice(0,16);
  const idx={}; teams.forEach(t=>idx[t.id]=t);
  let bracket=[[]]; for(let i=0;i<teams.length;i+=2)bracket[0].push({h:teams[i].id,a:teams[i+1].id,hs:null,as:null,w:null});
  let names=koRoundNames(16), stage=0, champion=null;
  function simN(t){ const H=idx[t.h].str,A=idx[t.a].str; let hs=poisson(clamp(1.3+(H-A)*0.04,0.2,4)),as=poisson(clamp(1.3+(A-H)*0.04,0.2,4)); if(hs===as){if(chance(H/(H+A)))hs++;else as++;} t.hs=hs;t.as=as;t.w=hs>as?t.h:t.a; }
  while(!champion){ bracket[stage].forEach(t=>{if(t.w===null)simN(t);}); const w=bracket[stage].map(t=>t.w); if(w.length===1){champion=w[0];} else {bracket.push([]); for(let i=0;i<w.length;i+=2)bracket[stage+1].push({h:w[i],a:w[i+1],hs:null,as:null,w:null}); stage++;} }
  const champNat=idx[champion];
  pushInbox("🏆 Copa do Mundo",`${champNat.name} é o CAMPEÃO da Copa do Mundo de ${G.season}!`,"good");
  if(called.length) clubPlayers(G.clubId).forEach(p=>p.morale=clamp(p.morale+3,10,99));
  G.lastWC={season:G.season,champion:champNat.name,bracket,names,teams:teams.map(t=>({id:t.id,name:t.name,colors:t.colors}))};
}
function natColors(nat){ return {BRA:["#fbe400","#1c8a3b"],ARG:["#87d8f7","#ffffff"],FRA:["#0a346f","#e2001a"],ENG:["#ffffff","#e2001a"],ESP:["#e2001a","#fbe400"],GER:["#000000","#fbe400"],ITA:["#0a52a0","#ffffff"],POR:["#e30613","#1c8a3b"],NED:["#f57b00","#ffffff"]}[nat]||["#888","#fff"]; }

function setPieceSel(lbl,key){
  const xi=startingXI(G.clubId);
  return `<div class="flex between center" style="margin:6px 0"><span class="small">${lbl}</span>
    <select class="sel" style="width:55%" onchange="G.tactics.${key}=parseInt(this.value);saveGame()">
    ${xi.map(p=>`<option value="${p.id}"${G.tactics[key]===p.id?' selected':''}>${p.name} (${p.tec})</option>`).join("")}</select></div>`;
}
function setFormation(f){ G.tactics.formation=f; autoPickLineup(); saveGame(); render(); }
function pitchCoords(f){
  const o=FORMATIONS[f]; const lines=[["GK"],o.DF,o.MF,o.FW];
  const coords=[]; const yPos=[90,70,48,24];
  lines.forEach((line,li)=>{
    const n=line.length;
    line.forEach((_,i)=>{ const x= n===1?50: 12+(i*(76/(n-1))); coords.push([x,yPos[li]]); });
  });
  return coords;
}

/* Negociação de compra/empréstimo */
function makeOffer(pid){
  const p=byId(pid); const c=myClub(); const seller=clubById(p.clubId);
  if(p.clubId===G.clubId){toast("Jogador já é seu");return;}
  if(G.window.indexOf("fechada")>=0 && isWindowOpen()===false){ toast("Janela fechada — aguarde a próxima janela"); return; }
  const ask=askingPrice(p);
  closeModal();
  modal(`<div class="flex between center"><h2 style="margin:0">Negociar — ${p.name}</h2><button class="btn sec sm" onclick="closeModal()">✕</button></div>
    <div class="small muted">${seller.name} · pede ~${fmtMoney(ask,c.cur)} · seu caixa ${fmtMoney(c.balance,c.cur)}</div>
    <div class="divider"></div>
    <h3 style="margin-top:0">Compra definitiva</h3>
    <label class="xs muted">Valor da proposta (${curSymbol(c.cur)})</label>
    <input class="sel" id="offFee" type="number" value="${ask}" style="margin-bottom:8px">
    <label class="xs muted">Salário anual oferecido (atual: ${fmtMoney(p.wage,c.cur)})</label>
    <input class="sel" id="offWage" type="number" value="${Math.round(p.wage*1.15)}" style="margin-bottom:8px">
    <label class="xs muted">Anos de contrato</label>
    <input class="sel" id="offYears" type="number" value="3" min="1" max="6" style="margin-bottom:10px">
    <button class="btn wide grn" onclick="submitOffer(${pid})">Enviar proposta de compra</button>
    <div class="divider"></div>
    <h3 style="margin-top:0">Empréstimo</h3>
    <label class="xs muted">Opção de compra ao fim (0 = sem opção)</label>
    <input class="sel" id="loanBuy" type="number" value="0" style="margin-bottom:10px">
    <button class="btn wide sec" onclick="submitLoan(${pid})">Pedir por empréstimo</button>`);
}
function submitOffer(pid){
  const p=byId(pid); const c=myClub(); const seller=clubById(p.clubId);
  const fee=Math.max(0,parseInt($("offFee").value)||0);
  const wage=Math.max(0,parseInt($("offWage").value)||0);
  const years=clamp(parseInt($("offYears").value)||3,1,6);
  if(fee>c.balance){ toast("Caixa insuficiente para essa proposta"); return; }
  const dec=clubAcceptsFee(seller,p,fee);
  if(!dec.ok){
    toast(`${seller.name} recusou. Contraproposta: ${fmtMoney(dec.counter,c.cur)}`);
    $("offFee").value=dec.counter; return;
  }
  if(!playerAcceptsMove(p,c,wage)){
    toast(`${p.name} recusou os termos salariais. Tente oferecer mais.`); return;
  }
  doTransfer(p,c,fee,wage,years);
  autoPickLineup(); saveGame(); closeModal(); render();
  toast(`✅ ${p.name} é o novo reforço do ${c.name}!`);
  pushInbox("✅ Contratação", `${p.name} (${p.ovr} OVR) assinou com o ${c.name} por ${fmtMoney(fee,c.cur)}.`,"good");
}
function submitLoan(pid){
  const p=byId(pid); const c=myClub(); const seller=clubById(p.clubId);
  const buyOpt=Math.max(0,parseInt($("loanBuy").value)||0);
  // clube aceita emprestar se jogador não é estrela e tem elenco
  if(p.ovr>=82){ toast(`${seller.name} não empresta um jogador desse nível.`); return; }
  if(clubPlayers(seller.id).length<=20){ toast(`${seller.name} não tem elenco para emprestar.`); return; }
  if(!chance(0.7)){ toast(`${seller.name} recusou o empréstimo.`); return; }
  doLoan(p,c,buyOpt);
  autoPickLineup(); saveGame(); closeModal(); render();
  toast(`🤝 ${p.name} chega por empréstimo!`);
}
function listPlayer(pid){
  const p=byId(pid); p.listed=!p.listed; saveGame(); closeModal();
  toast(p.listed?`${p.name} listado para venda (pedindo ${fmtMoney(askingPrice(p),myClub().cur)})`:`${p.name} retirado da lista`);
}
function acceptOffer(pid){
  const p=byId(pid); const o=p.pendingOffer; if(!o)return;
  const buyer=clubById(o.from);
  doTransfer(p,buyer,o.fee,Math.round(p.wage*1.2),4);
  p.pendingOffer=null;
  autoPickLineup(); saveGame(); render();
  toast(`💰 ${p.name} vendido ao ${buyer.name} por ${fmtMoney(o.fee,myClub().cur)}`);
  pushInbox("💰 Venda concluída", `${p.name} foi vendido ao ${buyer.name} por ${fmtMoney(o.fee,myClub().cur)}.`,"good");
}

function renderMatchLive(){

function statRow(lbl,h,a){
  const tot=h+a||1; const hp=h/tot*100;
  return `<div class="statbar"><b style="width:26px;text-align:right">${h}</b><div class="b"><i style="width:${hp}%;background:#58a6ff"></i><i style="width:${100-hp}%;background:#f85149"></i></div><b style="width:26px">${a}</b><span class="lbl">${lbl}</span></div>`;

function renderMatchControls(){
  const M=MATCH;
  if(M.finished){ $("mbCtrl").innerHTML=`<button class="btn grn g" onclick="${M.ctx?'finishCompMatchFlow()':'finishMatchFlow()'}">Continuar ▶</button>`; return; }

  $("mbCtrl").innerHTML=`
    <button class="btn ${M.running?'yel':'grn'} g" onclick="playPause()">${M.running?'⏸ Pausar':'▶ '+(M.min>0?'Continuar':'Iniciar')}</button>

function renderHalftime(){

function halftimeTactics(){

  modal(`<div class="flex between center"><h2 style="margin:0">Intervalo</h2><button class="btn sec sm" onclick="closeModal()">✕</button></div>

function subListHTML(){
  const M=MATCH; const myXI=(M.hId===G.clubId?M.hXI:M.aXI);
  const bench=clubPlayers(G.clubId).filter(p=>!myXI.includes(p)&&p.inj<=0&&p.ban<=0).sort((a,b)=>b.ovr-a.ovr);
  return `<div class="grid2 small">

    <div><b class="xs muted">BANCO</b>${bench.slice(0,8).map(p=>`<div class="flex between" style="margin:2px 0"><span>${p.name.split(' ').slice(-1)} <span class="xs muted">${p.ovr}</span></span><button class="btn sec grn" style="padding:2px 6px;font-size:10px" onclick="doSub(${p.id})">+</button></div>`).join("")}</div>

let selOut=null;
function doSub(pidIn){
  const M=MATCH;
  if(!selOut){ toast("Escolha quem sai primeiro (−)"); return; }
  if(M.subsLeft[G.clubId]<=0){ toast("Sem substituições restantes"); return; }
  const xi=(M.hId===G.clubId?M.hXI:M.aXI);
  const idx=xi.findIndex(p=>p.id===selOut); if(idx<0)return;
  const out=xi[idx], inp=byId(pidIn);
  xi[idx]=inp; M.subsLeft[G.clubId]--;
  addEv(M.min,`🔄 Substituição: entra ${inp.name}, sai ${out.name}.`,"");
  // recalcula força
  if(M.hId===G.clubId)M.H=teamStrength(G.clubId,{xi:M.hXI}); else M.A=teamStrength(G.clubId,{xi:M.aXI});
  selOut=null; halftimeTactics();
}
function halftimeContinue(){

function finishMatchFlow(){
  // simula resto da rodada e volta
  simulateRound();

}

/* ---------- Avanço de rodada / lesões / suspensões / evolução leve ---------- */
function advanceAfterRound(){
  G.date++;
  // folha salarial semanal (todos os clubes)
  G.clubs.forEach(c=>{ const w=weeklyWageBill(c.id); txn(c,-w,"Salários semanais","wages"); });
  // patrocínio (creditado em ~38 parcelas ao longo do ano)
  G.clubs.forEach(c=>{ txn(c, Math.round(c.sponsor/38), "Patrocínio", "sponsor"); });
  // alerta de fair play financeiro (meu clube)
  const me=myClub();
  if(me.balance<0){ pushInbox("⚠️ Finanças no vermelho", `O caixa está negativo (${fmtMoney(me.balance,me.cur)}). Venda jogadores ou controle os gastos para evitar punições do fair play financeiro.`,"bad"); }
  // janela e mercado vivo da IA
  if(isWindowOpen()) runAIMarket();
  // recuperação física + lesões/suspensões decrementam
  G.players.forEach(p=>{
    p.fitness=clamp(p.fitness+ri(10,22),0,100);
    if(p.inj>0)p.inj--; if(p.ban>0)p.ban--;
    // forma decai levemente p/ a média
    p.form*=0.85;
  });
  // pequenas lesões aleatórias no elenco do jogador a partir do desgaste
  clubPlayers(G.clubId).forEach(p=>{ if(p.inj<=0 && p.fitness<40 && chance(0.05)){ p.inj=ri(1,4); pushInbox("🚑 Lesão",`${p.name} se lesionou e ficará fora por ${p.inj} semana(s).`,"bad"); } });
  // re-escala se titular lesionado/suspenso saiu
  const lineupIds=new Set(G.tactics.lineup.map(l=>l.pid));
  let needRepick=false;
  G.tactics.lineup.forEach(l=>{ const p=byId(l.pid); if(!p||p.inj>0||p.ban>0)needRepick=true; });
  if(needRepick)autoPickLineup();
}

/* ---------- Fim de temporada ---------- */
function endSeason(){
  const c=myClub(); const L=leagueOf(c);
  const tbl=tableOf(L); const pos=tbl.findIndex(t=>t.id===c.id)+1;
  // troféu / histórico
  const champ=tbl[0];
  if(L.id) {
    // registra histórico do jogador
    G.history.unshift({season:G.season, league:L.name, posLabel:ord(pos)+" lugar"});
    if(pos===1){ G.trophies.unshift({name:L.name, season:G.season}); pushInbox("🏆 CAMPEÃO!",`Parabéns! O ${c.name} é CAMPEÃO do ${L.name} de ${G.season}!`,"good"); }
  }
  // premiação por colocação (todos os clubes da liga)
  tbl.forEach((club,i)=>{ const pz=Math.round((tbl.length-i)*(club.cur==="BRL"?1_500_000:600_000)*(L.tier===1?1.4:0.8)); txn(club,pz,"Premiação "+L.name,"prize"); });
  const prize = Math.round((tbl.length-pos+1) * (c.cur==="BRL"?1_500_000:600_000) * (L.tier===1?1.4:0.8));
  pushInbox("💰 Premiação", `O clube recebeu ${fmtMoney(prize,c.cur)} pela ${ord(pos)} colocação no ${L.name}.`,"good");

  modal(`<h2>Fim da Temporada ${G.season}</h2>
    <div class="card" style="text-align:center">
      <div class="muted">Campeão</div><div class="flex center" style="gap:8px;justify-content:center;margin:6px 0">${crest(champ,28)}<b>${champ.name}</b></div>
      <div class="divider"></div>
      <div class="muted">Sua colocação</div><div style="font-size:24px;font-weight:800">${ord(pos)} lugar</div>
      ${pos===1?'<div style="color:#3fb950;font-weight:700;margin-top:6px">🏆 CAMPEÃO!</div>':''}
    </div>
    <button class="btn wide grn" onclick="startNewSeason()">▶ Iniciar temporada ${G.season+1}</button>`);
}
function ord(n){ return n+"º"; }
function startNewSeason(){
  closeModal();
  // conclui copas pendentes, depois Mundial de Clubes e (a cada 4 temporadas) Copa do Mundo
  finishPendingComps();
  runClubWorldCup();
  if(G.season%4===2) runWorldCup();
  // envelhece, evolui, regens, zera stats
  progressPlayers();
  G.season++;
  // retorno de empréstimos (com opção de compra)
  G.players.filter(p=>p.loanFrom).forEach(p=>{
    if(p.clubId===G.clubId && p.loanBuy>0 && myClub().balance>=p.loanBuy && chance(0.8)){
      const seller=clubById(p.loanFrom);
      txn(myClub(),-p.loanBuy,"Opção de compra "+p.name,"buys");
      if(seller)txn(seller,p.loanBuy,"Venda "+p.name,"sales");
      pushInbox("✅ Opção exercida",`${p.name} foi comprado em definitivo por ${fmtMoney(p.loanBuy,myClub().cur)}.`,"good");
      p.loanFrom=null; p.loanBuy=0;
    } else {
      const back=clubById(p.loanFrom);
      if(back){ if(p.clubId===G.clubId)pushInbox("↩️ Fim de empréstimo",`${p.name} retornou ao ${back.name}.`,"info"); p.clubId=p.loanFrom; }
      p.loanFrom=null; p.loanBuy=0;
    }
  });
  // zera finanças da temporada
  G.clubs.forEach(c=>{ c.fin={gate:0,sponsor:0,prize:0,sales:0,wages:0,buys:0}; });
  G.players.forEach(p=>{ p.seasonStats={g:0,a:0,apps:0}; p.g=0;p.a=0;p.apps=0;p.yc=0;p.rc=0; });
  G.leagues.forEach(L=>{ buildLeagueSchedule(L); initStandings(L); });
  G.date=0; G.window="Pré-temporada";
  autoPickLineup();
  buildCompetitions();
  pushInbox("🆕 Nova temporada", `Bem-vindo à temporada ${G.season}! Prepare o elenco para os desafios que vêm pela frente.`,"info");
  saveGame(); curTab="elenco"; render();
  toast("Temporada "+G.season+" iniciada!");
}
function progressPlayers(){
  const retire=[];
  G.players.forEach(p=>{
    p.age++;
    // evolução por idade/minutos/desempenho
    const apps=p.seasonStats.apps;
    let delta=0;
    if(p.age<=p.peakAge-1){ delta = (p.pot>p.ovr? ri(0,3):0) + (apps>20?1:0); }
    else if(p.age<=p.peakAge+1){ delta = chance(0.4)?ri(-1,1):0; }
    else { delta = -ri(1,3) - (p.age>=34?1:0); }
    // bônus por boa temporada
    if(p.seasonStats.g+p.seasonStats.a>15)delta+=1;
    p.ovr=clamp(p.ovr+delta, 38, p.pot+1>99?99:Math.max(p.ovr+delta,p.ovr+delta));
    p.ovr=clamp(p.ovr, 38, 99);
    if(delta>0)recalcFromOvr(p);
    p.value=playerValue(p.ovr,p.pot,p.age,clubById(p.clubId).cur);
    p.contract--;
    // aposentadoria
    if(p.age>=35 && (p.ovr<70 || chance((p.age-34)*0.18))) retire.push(p);
  });
  // regens substituem aposentados
  retire.forEach(p=>{
    const club=clubById(p.clubId);
    if(p.clubId===G.clubId)pushInbox("👋 Aposentadoria",`${p.name} (${p.age}) pendurou as chuteiras após ${p.apps?'':''}uma carreira no ${club.name}.`,"info");
    p.retired=true;
  });
  G.players=G.players.filter(p=>!p.retired);
  // gera regens para repor números de elenco
  G.clubs.forEach(club=>{
    let sq=clubPlayers(club.id);
    while(sq.length<23){
      const grpNeed = neededGroup(sq);
      const pos=pick(POS_GROUPS[grpNeed]);
      const base = clamp(Math.round(club.rep*0.7+10)+ri(-6,2),48,72);
      const np=makePlayer(club,pos,base,{age:ri(16,19)});
      np.pot=clamp(np.ovr+ri(4,18),np.ovr,95); // jovens promissores
      G.players.push(np); sq.push(np);
    }
  });
}
function neededGroup(sq){
  const cnt={GK:0,DF:0,MF:0,FW:0}; sq.forEach(p=>cnt[p.posG]++);
  const target={GK:3,DF:8,MF:8,FW:6};
  let worst="MF",def=-99;
  Object.keys(target).forEach(g=>{ const d=target[g]-cnt[g]; if(d>def){def=d;worst=g;} });
  return worst;
}

function boot(){
  // tenta autoload do último slot
  const last=localStorage.getItem("fmmundial_lastslot");
  if(last && loadGame(parseInt(last))){ render(); }
  else showStart();
  // PWA: registra SW se possível (offline). Single-file: cacheia a própria página.
  if("serviceWorker" in navigator){
    try{
      const swCode=`self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>self.clients.claim());self.addEventListener("fetch",e=>{e.respondWith(caches.open("fm-v1").then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(resp=>{if(e.request.method==="GET")c.put(e.request,resp.clone());return resp;}).catch(()=>caches.match("./")))));});`;
      const blob=new Blob([swCode],{type:"application/javascript"});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    }catch(e){}
  }
}
